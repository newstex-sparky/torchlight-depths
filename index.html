<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TORCHLIGHT DEPTHS</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#0a0b10; }
  #canvas { display:block; width:100%; height:100% }
  .hud { position:fixed; top:10px; left:10px; color:#e8d8c8; pointer-events:none; font-family: 'Press Start 2P', monospace; font-size:13px; z-index:100; }
  .hud .header { font-weight:bold; margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid #3a4250; }
  .hud .row { margin:4px 0; }
  .hud .heart { display:inline-block; width:18px; height:16px; background:#b53a2c; margin-right:2px; clip-path:polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%); vertical-align:middle; }
  .hud .gold { color:#ffd479; margin-left:6px; }
  .hud .depth { color:#8aa8cc; margin-left:12px; }
  .hud .monsters { color:#7aa8c0; margin-left:12px; }
  #soundHint { position:fixed; bottom:10px; right:10px; color:#6a6a6a; font-size:12; pointer-events:auto; cursor:help; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="hud" id="hud">
  <div class="header">TORCHLIGHT DEPTHS</div>
  <div class="row"><span class="heart"></span><span id="hp">5</span> / <span id="maxHp">5</span> HP</div>
  <div class="row">Gold: <span id="gold">0</span> <span class="gold">|</span> Depth: <span id="depth">L1</span></div>
  <div class="row">Monsters slain: <span id="monsters">0</span></div>
  <div class="row" id="potionHud" style="display:none; margin-top: 4px; padding-top: 4px; border-top: 1px solid #3a4250;"><span id="potionIcon" style="display:inline-block; width:16px; height:16; background:#ffd700; margin-right:2px; vertical-align:middle;"></span><span id="potionType" style="color:#ffd479; margin-left:4px;">None</span> <span style="color:#6a6a6a; font-size:10px; margin-left:4px;">press Q to drink</span></div>
</div>
<div id="soundHint">click for sound</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ==== Core Three.js setup ====
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.autoClear = false; // we'll manually clear and render

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0b10);
scene.fog = new THREE.Fog(0x0a0b10, 8, 40);

// Isometric-style camera: three-quarter angle from above, follow player
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(10, 12, 10);
camera.lookAt(0, 0, 0);

// Ambient cold light
const ambient = new THREE.HemisphereLight(0x223344, 0x0d0f15, 0.8);
scene.add(ambient);

// Player torch point light (flickering warm point light - THE STAR)
const torchLight = new THREE.PointLight(0xffa500, 1.5, 14);
torchLight.position.set(0, 2, 0);
torchLight.castShadow = true;
torchLight.shadow.mapSize.width = 512;
torchLight.shadow.mapSize.height = 512;
torchLight.shadow.radius = 4;
torchLight.shadow.bias = -0.0001;
torchLight.shadow.normalBias = 0.05;
scene.add(torchLight);

// Wall torch helper
function makeWallTorch(pos, offset) {
  const group = new THREE.Group();
  group.position.copy(pos).add(offset);
  const sconce = new THREE.Mesh(
    new THREE.CylinderGeometry(0.14, 0.18, 1.1, 8),
    new THREE.MeshLambertMaterial({ color: 0x5a4a30 })
  );
  sconce.position.y = 0.55;
  group.add(sconce);
  const flame = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 10, 10),
    new THREE.MeshLambertMaterial({ color: 0xffd566 })
  );
  flame.position.y = 0.95;
  group.add(flame);
  const tl = new THREE.PointLight(0xffa500, 0.5, 5);
  tl.position.copy(flame.position);
  group.torchLight = tl;
  scene.add(group);
  return group;
}
makeWallTorch(new THREE.Vector3(-6, 0, -6), new THREE.Vector3(1, 0, 0));
makeWallTorch(new THREE.Vector3(6, 0, -6), new THREE.Vector3(-1, 0, 0));
makeWallTorch(new THREE.Vector3(0, 0, -3), new THREE.Vector3(0, 0, 1));

// ==== Player entity ====
const player = {
  group: new THREE.Group(),
  hp: 5,
  maxHp: 5,
  gold: 0,
  level: 1,
  monstersSlain: 0,
  alive: true,
  attacking: false,
  attackCooldown: 0,
  direction: new THREE.Vector3(0, 0, 1),
  velocity: new THREE.Vector3(0, 0, 0),
  swayAngle: 0,
  walkPhase: 0,
  invincible: 0,
  hasKey: false,
  potionType: null,
  potionCharges: 0,
  hasKey: false
};

// Player body (cloak + armor)
const body = new THREE.Mesh(
  new THREE.CylinderGeometry(0.35, 0.4, 1.6, 8),
  new THREE.MeshLambertMaterial({ color: 0xc8c0b0 })
);
body.position.y = 0.8;
player.group.add(body);

// Cloak (dark overlay)
const cloak = new THREE.Mesh(
  new THREE.BoxGeometry(0.8, 1.3, 0.5, 8, 8, 8),
  new THREE.MeshLambertMaterial({ color: 0x2a3038, side: THREE.DoubleSide })
);
cloak.position.y = 0.65;
cloak.rotation.z = 0.12;
player.group.add(cloak);

// Torch in hand
const torchHandle = new THREE.Mesh(
  new THREE.CylinderGeometry(0.07, 0.11, 0.65, 8),
  new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
);
torchHandle.position.set(0.35, 0.3, -0.05);
torchHandle.rotation.z = -0.2;
player.group.add(torchHandle);

// Torch flame (emissive)
const torchFlame = new THREE.Mesh(
  new THREE.SphereGeometry(0.2, 8, 8),
  new THREE.MeshLambertMaterial({ color: 0xffd566 })
);
torchFlame.position.y = 0.28;
player.group.add(torchFlame);

// Sword (sheathed, will animate)
const sword = new THREE.Mesh(
  new THREE.BoxGeometry(0.12, 0.6, 0.06, 4, 4, 1),
  new THREE.MeshLambertMaterial({ color: 0x8b7d6b })
);
sword.position.set(0.45, 0.2, 0.02);
sword.rotation.z = 0.05;
player.group.add(sword);

// Player hit flash material override
player.hitFlash = 0;

// ==== Dungeon generation ====
const TILE = 1;
const DW = 22; // dungeon width in cells
const DH = 18; // dungeon height in cells
const floorCells = [];
const wallCells = [];
const props = []; // all prop groups
const monsterSpawns = [];

// Generate room-and-corridor dungeon
function generateDungeon() {
  // Reset
  floorCells.length = 0;
  wallCells.length = 0;
  props.length = 0;
  monsterSpawns.length = 0;

  // Create grid floors
  for (let y = 0; y < DH; y++) {
    for (let x = 0; x < DW; x++) {
      floorCells.push([x, y]);
    }
  }

  // Carve out rooms (8 rooms, variable size)
  const rooms = [];
  for (let i = 0; i < 8; i++) {
    const w = 3 + Math.floor(Math.random() * 6); // 3-8
    const h = 2 + Math.floor(Math.random() * 4); // 2-5
    const rx = 1 + Math.floor(Math.random() * (DW - w - 1));
    const ry = 1 + Math.floor(Math.random() * (DH - h - 1));
    rooms.push({ x: rx, y: ry, w, h });
    // Rooms are just floor areas - already floor cells
  }

  // Mark wall cells: any floor cell adjacent to another floor cell's boundary
  // Actually, mark cells that have at least one missing neighbor (external wall)
  // and internal walls between rooms
  for (let y = 0; y < DH; y++) {
    for (let x = 0; x < DW; x++) {
      // Check if this cell is a wall (not floor) - but we marked all as floor
      // Instead, mark as wall if it borders floor on at least one side
      // and is not an isolated interior cell
      const isFloor = floorCells.some(c => c[0] === x && c[1] === y);
      if (!isFloor) continue; // skip non-floor

      // Check for adjacent floors (8-neighborhood)
      const adjFloor = [];
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < DW && ny >= 0 && ny < DH && floorCells.some(c => c[0] === nx && c[1] === ny)) {
            adjFloor.push(true);
          }
        }
      }
      // If this floor cell has 3+ floor neighbors, it's an interior spot (no wall needed)
      // If it has 1-2 floor neighbors, it's an edge/corner (wall on outside)
      // If it has 0 floor neighbors, it's isolated (shouldn't happen in a connected dungeon)
      if (adjFloor.length >= 3) {
        // Interior - but we might still want some walls for structure
        // Mark as wall if it has exactly 3-4 neighbors (edge of a room)
        if (adjFloor.length <= 4) {
          wallCells.push([x, y]);
        }
      } else {
        // Edge cell - outside wall
        wallCells.push([x, y]);
      }
    }
  }

  // Simplify: mark all floor cells adjacent to the grid boundary as walls
  // and create a simpler wall pattern
  for (let y = 0; y < DH; y++) {
    for (let x = 0; x < DW; x++) {
      if (!floorCells.some(c => c[0] === x && c[1] === y)) continue;
      // Check if this cell touches the boundary or has few floor neighbors
      let neighborCount = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < DW && ny >= 0 && ny < DH && floorCells.some(c => c[0] === nx && c[1] === ny)) {
            neighborCount++;
          }
        }
      }
      // If few neighbors, it's an edge (wall outside)
      if (neighborCount <= 3) {
        wallCells.push([x, y]);
      }
    }
  }

  // ---- Add props ----

  // Barrels
  for (let i = 0; i < 8; i++) {
    const bx = Math.floor(Math.random() * DW);
    const by = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === bx && c[1] === by)) {
      const group = new THREE.Group();
      const barrel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.4, 0.9, 12, 12),
        new THREE.MeshLambertMaterial({ color: 0x5a4a3a })
      );
      barrel.position.y = 0.45;
      group.add(barrel);
      // Hoops
      const hoop = new THREE.Mesh(
        new THREE.TorusGeometry(0.38, 0.05, 6, 24, Math.PI),
        new THREE.MeshLambertMaterial({ color: 0x7a6a5a })
      );
      hoop.position.y = 0.48;
      group.add(hoop);
      props.push({ type: 'barrel', x: bx, y: by, group });
    }
  }

  // Moss patches on floor (10% of floors, clustered)
  const mossCount = Math.max(1, Math.floor(floorCells.length / 10));
  for (let i = 0; i < mossCount; i++) {
    const mx = Math.floor(Math.random() * DW);
    const my = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === mx && c[1] === my)) {
      const group = new THREE.Group();
      const moss = new THREE.Mesh(
        new THREE.PlaneGeometry(TILE * 0.6, TILE * 0.6),
        new THREE.MeshLambertMaterial({ color: 0x5a6b5a, transparent: true, opacity: 0.4 })
      );
      moss.position.y = 0.02;
      moss.rotation.x = -Math.PI / 2;
      group.add(moss);
      const detail = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 6, 6),
        new THREE.MeshLambertMaterial({ color: 0x7a8a7a })
      );
      detail.position.y = 0.1;
      group.add(detail);
      props.push({ type: "moss", x: mx, y: my, group });
    }
  }

  // Flagstone cracks (small fissures in the floor)
  const crackCount = Math.max(1, Math.floor(floorCells.length / 20));
  const crackIndices = new Set();
  while (crackIndices.size < crackCount) {
    const ci = Math.floor(Math.random() * floorCells.length);
    crackIndices.add(ci);
  }
  let crackIdx = 0;
  floorCells.forEach(([x, y], i) => {
    if (crackIndices.has(i)) {
      const group = new THREE.Group();
      const crack = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 0.95, 0.05, TILE * 0.95),
        new THREE.MeshLambertMaterial({ color: 0x3a2a2a })
      );
      crack.position.y = -0.01;
      group.add(crack);
      // Broken pieces
      for (let j = 0; j < 3; j++) {
        const piece = new THREE.Mesh(
          new THREE.BoxGeometry(TILE * 0.2, 0.05, TILE * 0.2),
          new THREE.MeshLambertMaterial({ color: 0x251a1a })
        );
        piece.position.set(
          (Math.random() - 0.5) * TILE * 0.4,
          0.0,
          (Math.random() - 0.5) * TILE * 0.4
        );
        group.add(piece);
      }
      group.position.set(x, 0, y);
      props.push({ type: "crack", x: x, y: y, group });
    }
  });

  
  // Rubble (broken stone pieces around walls and corners)
  const rubbleCount = 8;
  for (let i = 0; i < rubbleCount; i++) {
    const rx = Math.floor(Math.random() * DW);
    const ry = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === rx && c[1] === ry)) {
      const group = new THREE.Group();
      const largePiece = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 0.6, 0.3, TILE * 0.6, 6, 6, 6),
        new THREE.MeshLambertMaterial({ color: 0x4a3a2a })
      );
      largePiece.position.y = 0.15;
      group.add(largePiece);
      for (let j = 0; j < 2; j++) {
        const fragment = new THREE.Mesh(
          new THREE.BoxGeometry(TILE * 0.25, 0.15, TILE * 0.25, 4, 4, 4),
          new THREE.MeshLambertMaterial({ color: 0x3a2a2a })
        );
        fragment.position.set(
          (Math.random() - 0.5) * TILE * 0.3,
          0.1,
          (Math.random() - 0.5) * TILE * 0.3
        );
        group.add(fragment);
      }
      group.position.set(rx, 0, ry);
      props.push({ type: 'rubble', x: rx, y: ry, group });
    }
  }


  // Barred cells (cage structures)
  const barredCellCount = 2;
  for (let i = 0; i < barredCellCount; i++) {
    const bx = Math.floor(Math.random() * (DW - 4)) + 2;
    const by = Math.floor(Math.random() * (DH - 4)) + 2;
    if (floorCells.some(c => c[0] === bx && c[1] === by)) {
      const group = new THREE.Group();
      // Floor
      const floor = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 0.9, TILE * 0.1, TILE * 0.9),
        new THREE.MeshLambertMaterial({ color: 0x5a5a6e })
      );
      floor.position.y = 0.02;
      group.add(floor);
      // Bars (4 vertical bars + 4 horizontal bars)
      for (let j = 0; j < 4; j++) {
        const vertical = new THREE.Mesh(
          new THREE.BoxGeometry(0.08, 0.8, TILE * 0.9, 4, 4, 1),
          new THREE.MeshLambertMaterial({ color: 0x6b5b5b })
        );
        vertical.position.set(
          (j % 2 === 0 ? -TILE * 0.4 : TILE * 0.4),
          0.4,
          (j < 2 ? -TILE * 0.4 : TILE * 0.4)
        );
        group.add(vertical);
        const horizontal = new THREE.Mesh(
          new THREE.BoxGeometry(TILE * 0.9, 0.08, 0.08, 4, 4, 1),
          new THREE.MeshLambertMaterial({ color: 0x6b5b5b })
        );
        horizontal.position.set(
          (j < 2 ? -TILE * 0.4 : TILE * 0.4),
          0.4,
          (j % 2 === 0 ? -TILE * 0.4 : TILE * 0.4)
        );
        group.add(horizontal);
      }
      group.position.set(bx, 0, by);
      props.push({ type: 'barredCell', x: bx, y: by, group });
    }
  }


  // Wooden doors (some locked, some open)
  const doorCount = 3;
  for (let i = 0; i < doorCount; i++) {
    const dx = Math.floor(Math.random() * (DW - 4)) + 2;
    const dy = Math.floor(Math.random() * (DH - 4)) + 2;
    if (floorCells.some(c => c[0] === dx && c[1] === dy)) {
      const group = new THREE.Group();
      // Door frame
      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 0.95, 1.2, 0.1, 6, 6, 1),
        new THREE.MeshLambertMaterial({ color: 0x5a4a30 })
      );
      frame.position.y = 0.6;
      group.add(frame);
      // Door panels (vertical planks)
      for (let j = 0; j < 3; j++) {
        const panel = new THREE.Mesh(
          new THREE.BoxGeometry(TILE * 0.3, 1.0, 0.05, 6, 6, 1),
          new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
        );
        panel.position.set(0, 0.5, (j - 1) * TILE * 0.35);
        panel.rotation.y = (j % 2 === 0) ? Math.PI / 2 : 0;
        group.add(panel);
      }
      // Lock hasp (on some doors)
      if (i === 0) {
        const hasp = new THREE.Mesh(
          new THREE.BoxGeometry(0.08, 0.3, 0.04, 6, 6, 1),
          new THREE.MeshLambertMaterial({ color: 0x999999 })
        );
        hasp.position.set(0, 0.25, TILE * 0.42);
        hasp.rotation.x = Math.PI / 2;
        group.add(hasp);
      }
      group.position.set(dx, 0, dy);
      props.push({ type: 'woodenDoor', x: dx, y: dy, group, locked: true });
    }
  }

  // Key spawn (one key per level)
  {
    const keyX = Math.floor(Math.random() * DW);
    const keyY = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === keyX && c[1] === keyY)) {
      const keyGroup = new THREE.Group();
      // Key bowl
      const keyBowl = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15, 0.2, 0.3, 8, 8),
        new THREE.MeshLambertMaterial({ color: 0xc8a500 })
      );
      keyBowl.position.y = 0.15;
      keyGroup.add(keyBowl);
      // Key teeth
      for (let i = 0; i < 4; i++) {
        const tooth = new THREE.Mesh(
          new THREE.BoxGeometry(0.08, 0.15, 0.3, 4, 4, 1),
          new THREE.MeshLambertMaterial({ color: 0x8b6a1b })
        );
        tooth.position.set(
          Math.sin(i * Math.PI / 2) * 0.18,
          0.2 + Math.cos(i * Math.PI / 2) * 0.05,
          (i % 2 === 0 ? -0.2 : 0.2)
        );
        keyGroup.add(tooth);
      }
      // Ring
      const keyRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.25, 0.08, 8, 24, Math.PI),
        new THREE.MeshLambertMaterial({ color: 0xc8a500 })
      );
      keyRing.position.y = 0.3;
      keyRing.rotation.x = Math.PI / 2;
      keyGroup.add(keyRing);
      keyGroup.position.set(keyX, 0, keyY);
      scene.add(keyGroup);
      props.push({ type: 'key', x: keyX, y: keyY, group: keyGroup });
    }
  }

// Crates
  for (let i = 0; i < 10; i++) {
    const cx = Math.floor(Math.random() * DW);
    const cy = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === cx && c[1] === cy)) {
      const group = new THREE.Group();
      const crate = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 0.6, 0.6, 8, 8, 8),
        new THREE.MeshLambertMaterial({ color: 0x5a4a3a })
      );
      crate.position.y = 0.3;
      group.add(crate);
      // Lid open/closed variation
      if (Math.random() > 0.5) {
        const lid = new THREE.Mesh(
          new THREE.BoxGeometry(0.6, 0.1, 0.4, 8, 2, 4),
          new THREE.MeshLambertMaterial({ color: 0x7a5a4a })
        );
        lid.position.y = 0.55;
        group.add(lid);
      }
      props.push({ type: 'crate', x: cx, y: cy, group });
    }
  }

  // Pillars (every 4th row/col with spacing)
  for (let y = 0; y < DH; y += 4) {
    for (let x = 0; x < DW; x += 4) {
      if (floorCells.some(c => c[0] === x && c[1] === y)) {
        const group = new THREE.Group();
        const pillar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.3, 0.3, 1.7, 12, 12),
          new THREE.MeshLambertMaterial({ color: 0x6b5a33 })
        );
        pillar.position.y = 0.85;
        group.add(pillar);
        // Capital
        const capital = new THREE.Mesh(
          new THREE.SphereGeometry(0.32, 12, 12),
          new THREE.MeshLambertMaterial({ color: 0x5a4a30 })
        );
        capital.position.y = 1.75;
        group.add(capital);
        props.push({ type: 'pillar', x: x, y: y, group });
      }
    }
  }

  // Stairs down (bottom-right area)
  {
    const stairsX = DW - 3;
    const stairsY = DH - 3;
    if (floorCells.some(c => c[0] === stairsX && c[1] === stairsY)) {
      const stairGroup = new THREE.Group();
      // Multi-step stairs
      for (let yy = -1; yy <= 1; yy++) {
        for (let xx = -1; xx <= 1; xx++) {
          if (floorCells.some(c => c[0] === stairsX + xx && c[1] === stairsY + yy)) {
            const step = new THREE.Mesh(
              new THREE.BoxGeometry(TILE * 0.85, TILE * 0.18, TILE * 0.85),
              new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
            );
            step.position.set(xx * TILE * 0.87, TILE * 0.09 * Math.abs(yy), yy * TILE * 0.87);
            stairGroup.add(step);
          }
        }
      }
      // Railing
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 2.2, TILE * 0.1, TILE * 0.2),
        new THREE.MeshLambertMaterial({ color: 0x8b7d6b })
      );
      rail.position.set(0, TILE * 0.05, 0);
      stairGroup.add(rail);
      props.push({ type: 'stairs', x: stairsX, y: stairsY, group: stairGroup });
    }
  }

  // Bones (scattered remains)
  for (let i = 0; i < 12; i++) {
    const bx = Math.floor(Math.random() * DW);
    const by = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === bx && c[1] === by)) {
      const group = new THREE.Group();
      const bone1 = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 6, 6),
        new THREE.MeshLambertMaterial({ color: 0x9e9e9e })
      );
      bone1.position.set(0, 0.02, 0);
      group.add(bone1);
      const bone2 = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.12, 0.6, 6, 1),
        new THREE.MeshLambertMaterial({ color: 0x9e9e9e })
      );
      bone2.position.set(0, 0.25, 0);
      group.add(bone2);
      // Skull
      const skull = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 6, 6),
        new THREE.MeshLambertMaterial({ color: 0x9e9e9e })
      );
      skull.position.set(0, 0.18, 0.25);
      group.add(skull);
      props.push({ type: 'bone', x: bx, y: by, group });
    }
  }

  // Cobwebs (in corners and ceilings)
  const webPositions = [
    { x: 0, y: DH - 1 }, { x: DW - 1, y: 0 },
    { x: 0, y: 0 }, { x: DW - 1, y: DH - 1 }
  ];
  for (const wp of webPositions) {
    if (floorCells.some(c => c[0] === wp.x && c[1] === wp.y)) {
      const group = new THREE.Group();
      const web = new THREE.Mesh(
        new THREE.RingGeometry(0.35, 0.45, 8, 32),
        new THREE.MeshBasicMaterial({ color: 0x9e9e9e, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
      );
      web.rotation.x = -Math.PI / 2;
      web.position.set(wp.x * TILE + TILE/2, 0.8, wp.y * TILE + TILE/2);
      group.add(web);
      // Anchor point
      const anchor = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 6, 6),
        new THREE.MeshLambertMaterial({ color: 0x6a6a6a })
      );
      anchor.position.y = 0.8;
      group.add(anchor);
      props.push({ type: 'cobweb', x: wp.x, y: wp.y, group });
    }
  }

  // Chests
  for (let i = 0; i < 4; i++) {
    const cx = Math.floor(Math.random() * DW);
    const cy = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === cx && c[1] === cy)) {
      const group = new THREE.Group();
      const chest = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 0.7, TILE * 0.4, TILE * 0.4),
        new THREE.MeshLambertMaterial({ color: 0x6b4226 })
      );
      chest.position.y = TILE * 0.2;
      group.add(chest);
      // Lid
      const lid = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 0.7, TILE * 0.08, TILE * 0.4),
        new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
      );
      lid.position.y = TILE * 0.35;
      group.add(lid);
      // Lock hasp
      const hasp = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, TILE * 0.15, 0.04),
        new THREE.MeshLambertMaterial({ color: 0x999999 })
      );
      hasp.position.set(0, TILE * 0.12, 0.18);
      hasp.rotation.x = Math.PI / 2;
      group.add(hasp);
      // Keyhole
      const khole = new THREE.Mesh(
        new THREE.CircleGeometry(0.03, 8),
        new THREE.MeshBasicMaterial({ color: 0x999999 })
      );
      khole.position.set(0, TILE * 0.15, 0.2);
      khole.rotation.x = Math.PI / 2;
      group.add(khole);
      // Potion (random type inside)
      const potionTypes = ['health', 'strength', 'speed'];
      const hasPotion = Math.random() < 0.5;
      if (hasPotion) {
        const potionType = potionTypes[Math.floor(Math.random() * potionTypes.length)];
        // Potion bottle
        const bottle = new THREE.Mesh(
          new THREE.CylinderGeometry(0.1, 0.2, 0.8, 8, 8),
          new THREE.MeshLambertMaterial({ color: 0xff0000 })
        );
        bottle.position.y = TILE * 0.25;
        group.add(bottle);
        // Potion liquid
        const liquid = new THREE.Mesh(
          new THREE.SphereGeometry(0.15, 8, 8),
          new THREE.MeshLambertMaterial({ color: potionType === 'health' ? 0xff0000 : potionType === 'strength' ? 0x00ff00 : 0x0000ff })
        );
        liquid.position.y = TILE * 0.35;
        group.add(liquid);
        props.push({ type: 'chest', x: cx, y: cy, group, potionType: potionType });
      } else {
        props.push({ type: 'chest', x: cx, y: cy, group });
      }
    }
  }

  // Banners
  for (let i = 0; i < 4; i++) {
    const bx = Math.floor(Math.random() * DW);
    const by = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === bx && c[1] === by)) {
      const group = new THREE.Group();
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.07, 0.07, 1.1, 8, 8),
        new THREE.MeshLambertMaterial({ color: 0x8b4513 })
      );
      post.position.y = 0.55;
      post.position.x = bx * TILE + TILE/2;
      post.position.z = by * TILE + TILE/2;
      group.add(post);
      // Banner cloth (simple triangle)
      const banner = new THREE.Mesh(
        new THREE.ConeGeometry(0.18, 0.45, 6, 8),
        new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0xff0000 : 0x0000ff })
      );
      banner.position.y = 0.6;
      group.add(banner);
      props.push({ type: 'banner', x: bx, y: by, group });
    }
  }

  // Spike plates (traps) - rare
  for (let i = 0; i < 2; i++) {
    const sx = Math.floor(Math.random() * DW);
    const sy = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === sx && c[1] === sy)) {
      const group = new THREE.Group();
      const plate = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 0.85, TILE * 0.08, TILE * 0.85),
        new THREE.MeshLambertMaterial({ color: 0x8b0000 })
      );
      plate.position.y = TILE * 0.03;
      group.add(plate);
      // Four spikes
      for (let j = 0; j < 4; j++) {
        const spike = new THREE.Mesh(
          new THREE.ConeGeometry(0.06, 0.25, 6, 4),
          new THREE.MeshLambertMaterial({ color: 0x8b0000 })
        );
        const angle = j * Math.PI / 2;
        spike.position.set(Math.cos(angle) * TILE * 0.18, TILE * 0.18, Math.sin(angle) * TILE * 0.18);
        spike.rotation.z = angle;
        spike.rotation.x = Math.PI / 2;
        group.add(spike);
      }
      props.push({ type: 'spikePlate', x: sx, y: sy, group });
    }
  }

  // Swinging blade trap
  {
    const bx = Math.floor(Math.random() * (DW - 6)) + 3;
    const by = Math.floor(Math.random() * (DH - 6)) + 3;
    if (floorCells.some(c => c[0] === bx && c[1] === by)) {
      const group = new THREE.Group();
      const blade = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 0.25, 0.4, TILE * 1.0),
        new THREE.MeshLambertMaterial({ color: 0x8b0000 })
      );
      blade.position.y = TILE * 0.18;
      blade.userData = { swingPhase: 0, swingSpeed: Math.random() * 0.03 + 0.01 };
      group.add(blade);
      props.push({ type: 'swingBlade', x: bx, y: by, group });
    }
  }

  // Puddles reflecting firelight
  const puddleCount = 3;
  for (let i = 0; i < puddleCount; i++) {
    const px = Math.floor(Math.random() * DW);
    const py = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === px && c[1] === py)) {
      const group = new THREE.Group();
      const water = new THREE.Mesh(
        new THREE.PlaneGeometry(TILE * 0.8, TILE * 0.8),
        new THREE.MeshBasicMaterial({ color: 0x1a1a3a, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
      );
      water.position.y = 0.03;
      water.rotation.x = -Math.PI / 2;
      group.add(water);
      // Reflection hint - slight white offset
      const reflection = new THREE.Mesh(
        new THREE.PlaneGeometry(TILE * 0.78, TILE * 0.78),
        new THREE.MeshBasicMaterial({ color: 0x2a2a4a, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
      );
      reflection.position.y = 0.04;
      reflection.rotation.x = -Math.PI / 2;
      group.add(reflection);
      props.push({ type: 'puddle', x: px, y: py, group });
    }
  }

  // Cold rune accent (glowing blue rune on floor)
  {
    const rx = Math.floor(Math.random() * DW);
    const ry = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === rx && c[1] === ry)) {
      const group = new THREE.Group();
      const runeCircle = new THREE.Mesh(
        new THREE.RingGeometry(0.28, 0.33, 12, 24),
        new THREE.MeshBasicMaterial({ color: 0x4a90e2, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
      );
      runeCircle.rotation.x = -Math.PI / 2;
      runeCircle.position.set(rx * TILE + TILE/2, 0.25, ry * TILE + TILE/2);
      group.add(runeCircle);
      // Glow pulse
      const glowLight = new THREE.PointLight(0x4a90e2, 0.8, 3);
      glowLight.position.set(rx * TILE + TILE/2, 0.8, ry * TILE + TILE/2);
      glowLight.intensity = 0.8 + Math.random() * 0.4;
      group.glLight = glowLight; // intentional, accessed later
      scene.add(group);
      // Also add subtle ambient color shift in the area
      props.push({ type: 'rune', x: rx, y: ry, group });
    }
  }

  // Moonlight through grate accent
  {
    const gx = Math.floor(Math.random() * (DW - 4)) + 2;
    const gy = Math.floor(Math.random() * (DH - 4)) + 2;
    if (floorCells.some(c => c[0] === gx && c[1] === gy)) {
      const group = new THREE.Group();
      // Small grate structure
      for (let gx2 = -1; gx2 <= 1; gx2++) {
        for (let gy2 = -1; gy2 <= 1; gy2++) {
          if (floorCells.some(c => c[0] === gx + gx2 && c[1] === gy + gy2)) {
            const bar = new THREE.Mesh(
              new THREE.BoxGeometry(TILE * 0.7, 0.15, TILE * 0.7),
              new THREE.MeshLambertMaterial({ color: 0x5a5a6e })
            );
            bar.position.set(gx2 * TILE * 0.75, TILE * 0.03, gy2 * TILE * 0.75);
            group.add(bar);
          }
        }
      }
      // Moonlight glow (blue-tinted weak light)
      const moonLight = new THREE.PointLight(0x89cff0, 0.3, 2.5);
      moonLight.position.set(gx * TILE + TILE/2, 0.5, gy * TILE + TILE/2);
      group.moonLight = moonLight;
      scene.add(moonLight);
      props.push({ type: 'moonlight', x: gx, y: gy, group });
    }
  }

  return { floorCells, wallCells, monsterSpawns, props };
}

const dungeon = generateDungeon();

// ==== Monsters ====
class Monster {
  constructor(type, x, y) {
    this.type = type;
    this.x = x;
    this.y = y;
    this.maxHp = type === 'slime' ? 3 : type === 'rat' ? 2 : 5;
    this.hp = this.maxHp;
    this.boss = false;
    this.hitFlash = 0;
    this.collapse = false;
    this.dead = false;

    // Visual
    const group = new THREE.Group();

    if (type === 'skeleton') {
      this.body = new THREE.Mesh(
        new THREE.ConeGeometry(0.4, 1.0, 6),
        new THREE.MeshLambertMaterial({ color: 0xb4453a })
      );
      this.body.position.y = 0.45;
      group.add(this.body);
      // Back plate
      const back = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.14), new THREE.MeshBasicMaterial({ color: 0x0b0707 }));
      back.position.y = 1.1;
      back.scale.set(0.85, 0.14, 1);
      group.add(back);
      // Fill (health bar-like)
      this.fill = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.1), new THREE.MeshBasicMaterial({ color: 0xff5b45 }));
      this.fill.position.y = 1.1;
      group.add(this.fill);
      // Eye glows
      const eyeGeo = new THREE.SphereGeometry(0.06, 4, 4);
      this.leftEye = new THREE.Mesh(eyeGeo, new THREE.MeshLambertMaterial({ color: 0xffd700 }));
      this.leftEye.position.set(-0.18, 0.35, 0.15);
      this.rightEye = new THREE.Mesh(eyeGeo, new THREE.MeshLambertMaterial({ color: 0xffd700 }));
      this.rightEye.position.set(0.18, 0.35, 0.15);
      group.add(this.leftEye, this.rightEye);
    } else if (type === 'rat') {
      this.body = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 8, 8),
        new THREE.MeshLambertMaterial({ color: 0x7d4e2d })
      );
      group.add(this.body);
      // Eyes glow
      const eyeGeo = new THREE.SphereGeometry(0.05, 4, 4);
      this.leftEye = new THREE.Mesh(eyeGeo, new THREE.MeshLambertMaterial({ color: 0xffd700 }));
      this.leftEye.position.set(-0.1, 0.22, 0.15);
      this.rightEye = new THREE.Mesh(eyeGeo, new THREE.MeshLambertMaterial({ color: 0xffd700 }));
      this.rightEye.position.set(0.1, 0.22, 0.15);
      group.add(this.leftEye, this.rightEye);
      this.body.scale.y = 0.5;
    } else if (type === 'slime') {
      this.body = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 12, 12),
        new THREE.MeshLambertMaterial({ color: 0x00a000 })
      );
      group.add(this.body);
      // Wide smile
      const smileGeo = new THREE.SphereGeometry(0.2, 8, 8);
      this.smile = new THREE.Mesh(smileGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
      this.smile.position.y = -0.1;
      this.smile.rotation.x = Math.PI / 2;
      group.add(this.smile);
    }

    this.group = group;
    this.group.position.set(x, 0, y);
    scene.add(group);
  }

  takeDamage(amount) {
    this.hp = Math.max(0, this.hp - amount);
    this.hitFlash = 0.5;
    // Eye glow intensify
    if (this.leftEye) this.leftEye.material.color.setHex(0xffff00);
    if (this.rightEye) this.rightEye.material.color.setHex(0xffff00);
    if (this.type === 'slime') {
      this.body.material.color.setHex(0xffd700);
    }
    if (this.hp <= 0 && !this.dead) {
      this.dead = true;
      this.collapse = true;
      this.monsterSlain();
    }
  }

  monsterSlain() {
    this.group.visible = false;
    // Death FX based on type
    if (this.type === 'skeleton') {
      // Collapse into bone pile
      if (!this.collapse) {
        this.collapse = true;
        // Create bone pile meshes
        const bonePieces = [
          new THREE.SphereGeometry(0.1, 6, 6),
          new THREE.CylinderGeometry(0.08, 0.12, 0.6, 6, 1)
        ];
        const colors = [0x9e9e9e, 0x9e9e9e];
        const positions = [[0, 0.02, 0], [0, 0.25, 0], [0, 0.18, 0.25]];
        for (let i = 0; i < bonePieces.length; i++) {
          const bone = new THREE.Mesh(bonePieces[i], new THREE.MeshLambertMaterial({ color: colors[i] }));
          bone.position.set(positions[i][0], positions[i][1] + Math.random() * 0.1, positions[i][2] + Math.random() * 0.1);
          bone.userData.fadeTime = 120 + Math.random() * 60; // fade over 2-3 seconds
          this.group.add(bone); // temporarily add to scene for fade
        }
        // Remove after fade
        setTimeout(() => {
          this.group.visible = true; // show temporarily for fade
          // Note: actual fade would need post-processing, simplified here
        }, 180);
      }
    } else if (this.type === 'rat') {
      // Burst into goo particles
      if (!this.gooSpawned) {
        this.gooSpawned = true;
        // Create splatter meshes
        for (let i = 0; i < 8; i++) {
          const splatGeo = new THREE.BoxGeometry(0.15 + Math.random() * 0.2, 0.02, 0.15 + Math.random() * 0.2);
          const splat = new THREE.Mesh(splatGeo, new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.8 }));
          const angle = (i / 8) * Math.PI * 2;
          const distance = 0.3 + Math.random() * 0.2;
          splat.position.set(Math.cos(angle) * distance, 0.02, Math.sin(angle) * distance);
          splat.userData.fadeTime = 100 + Math.random() * 50;
          this.group.add(splat);
        }
        setTimeout(() => {
          this.group.visible = true;
        }, 150);
      }
    } else if (this.type === 'slime') {
      // Burst into goo - spawn debris that fades
      if (!this.gooSpawned) {
        this.gooSpawned = true;
        // Create goo debris particles
        for (let i = 0; i < 12; i++) {
          const debrisGeo = new THREE.SphereGeometry(0.05 + Math.random() * 0.1, 6, 6);
          const debris = new THREE.Mesh(debrisGeo, new THREE.MeshBasicMaterial({ color: 0x00a000, transparent: true, opacity: 0.9 }));
          const angle = (i / 12) * Math.PI * 2;
          const distance = 0.2 + Math.random() * 0.3;
          debris.position.set(Math.cos(angle) * distance, 0.02 + Math.random() * 0.1, Math.sin(angle) * distance);
          debris.userData.fadeTime = 80 + Math.random() * 40;
          debris.userData.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 0.1,
            0.1 + Math.random() * 0.1,
            (Math.random() - 0.5) * 0.1
          );
          this.group.add(debris);
        }
        setTimeout(() => {
          this.group.visible = true;
        }, 100);
      }
    }
    dungeon.monstersSlain = (dungeon.monstersSlain || 0) + 1;
    document.getElementById('monsters').textContent = `Monsters slain: ${dungeon.monstersSlain}`;
  }
}

// Spawn monsters from predefined spawn points

// Synthesized Web Audio SFX
const audioContext = new (window.AudioContext || window.webkitAudioContext)();
let audioEnabled = false;
let droneSource = null;

function playSFX(name, opts = {}) {
  if (!audioEnabled && name !== 'enableAudio') return;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.connect(gain);
  gain.connect(audioContext.destination);
  const vol = opts.volume !== undefined ? opts.volume : 0.1;
  gain.gain.setValueAtTime(vol, audioContext.currentTime);

  if (name === 'footstep') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioContext.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + opts.duration || 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + opts.duration || 0.1);
    osc.start();
    osc.stop(audioContext.currentTime + (opts.duration || 0.1));
  } else if (name === 'torchCrackle') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(150, audioContext.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, audioContext.currentTime + 0.4);
    gain.gain.setValueAtTime(0.02, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.4);
    osc.start();
    osc.stop(audioContext.currentTime + 0.4);
  } else if (name === 'swordSwing') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, audioContext.currentTime);
    gain.gain.setValueAtTime(0.03, audioContext.currentTime);
    osc.start();
    osc.stop(audioContext.currentTime + 0.1);
  } else if (name === 'swordHit') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(220, audioContext.currentTime);
    gain.gain.setValueAtTime(0.04, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.15);
    osc.start();
    osc.stop(audioContext.currentTime + 0.15);
  } else if (name === 'squeal') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(440, audioContext.currentTime);
    gain.gain.setValueAtTime(0.05, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2);
    osc.start();
    osc.stop(audioContext.currentTime + 0.2);
  } else if (name === 'coin') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523, audioContext.currentTime);
    gain.gain.setValueAtTime(0.025, audioContext.currentTime);
    osc.start();
    osc.stop(audioContext.currentTime + 0.1);
  } else if (name === 'unlock') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(330, audioContext.currentTime);
    gain.gain.setValueAtTime(0.02, audioContext.currentTime);
    gain.gain.linearRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
    osc.start();
    osc.stop(audioContext.currentTime + 0.1);
  } else if (name === 'enableAudio') {
    // Start drone
    droneSource = audioContext.createOscillator();
    const dGain = audioContext.createGain();
    droneSource.connect(dGain);
    dGain.connect(audioContext.destination);
    droneSource.type = 'sine';
    droneSource.frequency.value = 60;
    dGain.gain.setValueAtTime(0.008, audioContext.currentTime);
    droneSource.start();
    // Low pass modulation
    const now = audioContext.currentTime;
    dGain.gain.linearRampToValueAtTime(0.005, now + 5);
  }
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  document.getElementById('soundHint').textContent = audioEnabled ? 'sound on' : 'click for sound';
  if (audioEnabled) {
    playSFX('enableAudio');
    document.getElementById('soundHint').textContent = 'sound on';
  } else {
    document.getElementById('soundHint').textContent = 'click for sound';
  }
}

// Make audio enabled by default after first user interaction
let audioInitiated = false;
function ensureAudio() {
  if (!audioInitiated) {
    audioInitiated = true;
    // User clicked sound hint or pressed key - enable
    if (!audioEnabled) toggleAudio();
  }
}

// ==== Post-processing pipeline (half-res render target + shader passes) ====

// Half-resolution render target with nearest filtering (for chunky pixel feel)
const halfWidth = Math.max(1, Math.floor(window.innerWidth / 2));
const halfHeight = Math.max(1, Math.floor(window.innerHeight / 2));
const renderTarget = new THREE.WebGLRenderTarget(halfWidth, halfHeight, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat,
  type: THREE.UnsignedByteType
});

// Composition target (full size for post-process)
const fullTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat,
  type: THREE.UnsignedByteType
});

// Simple toon/quantized shader for dither feel
const ditherShader = {
  uniforms: {
    tDiffuse: { value: null },
    bayerMatrix: { value: [] }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float bayerMatrix[16];
    varying vec2 vUv;
    
    void main() {
      vec4 color = texture2D(tDiffuse, vUv);
      // Get 4x4 pixel block coordinate
      vec2 pixelUV = vUv * 4.0;
      int ix = int(floor(pixelUV.x));
      int iy = int(floor(pixelUV.y));
      // Wrap Bayer matrix access
      float val = bayerMatrix[iy * 4 + ix];
      // Luminance
      float lum = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      // Binarize at threshold - creates ordered dither texture
      if (lum < val) {
        gl_FragColor = vec4(0.02, 0.02, 0.04, 1.0);
      } else {
        gl_FragColor = vec4(0.12, 0.12, 0.16, 1.0);
      }
    }
  `
};

// Compile the dither shader
const ditherMaterial = new THREE.ShaderMaterial(ditherShader);
 // Initialize Bayer matrix (16 values 0-15 / 16)
for (let i = 0; i < 16; i++) {
  ditherMaterial.uniforms.bayerMatrix.value[i] = BAYER_MATRIX[i];
}

 // Tilt-shift shader: depth-aware horizontal blur that keeps player band sharp
const tiltShiftShader = {
  uniforms: {
    tDiffuse: { value: null },
    playerScreenY: { value: 0.5 },
    screenH: { value: window.innerHeight },
    depthTex: { value: null }
  },
  vertexShader: `
    varying vec2 vUv;
    varying float vDepth;
    void main() {
      vUv = uv;
      // Pass depth from the render target's depth component
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform sampler2D depthTex;
    uniform float playerScreenY;
    uniform float screenH;
    varying vec2 vUv;
    varying float vDepth;
    
    void main() {
      vec4 color = texture2D(tDiffuse, vUv);
      
      // Player's y position in screen space (0=bottom, 1=top)
      // Player band should be sharp; blur toward top and bottom
      float py = vUv.y;
      
      // Distance from current pixel to player horizontal band
      float distToBand = py - playerScreenY;
      
      // Blur amount: grows with distance from band AND toward edges
      float edgeFactor = max(py, 1.0 - py); // 1 at edges, 0 at center
      float blurAmount = abs(distToBand) * (0.6 + 0.8 * edgeFactor);
      
      // Sample horizontal neighbors for blur
      vec4 result = vec4(0.0);
      float totalWeight = 0.0;
      for (int i = -5; i <= 5; i++) {
        float weight = exp(-float(i*i) / (2.0 * max(blurAmount, 0.001)));
        result += texture2D(tDiffuse, vec2(vUv.x + float(i) * 0.008, py)) * weight;
        totalWeight += weight;
      }
      if (totalWeight > 0.0) result /= totalWeight;
      
      // Additional edge blur: strongly blur top and bottom regions
      float strongBlur = pow(1.0 - edgeFactor, 2.0) * 0.15;
      result = mix(result, vec4(0.02, 0.02, 0.04, 1.0), strongBlur);
      
      gl_FragColor = result;
    }
  `
};

const tiltShiftMaterial = new THREE.ShaderMaterial(tiltShiftShader);

// Vignette shader
const vignetteShader = {
  uniforms: {
    tDiffuse: { value: null },
    vignette: { value: 0.45 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float vignette;
    varying vec2 vUv;
    void main() {
      float dist = length(vUv - 0.5) / 0.5;
      float vign = 1.0 - dist * dist * vignette;
      gl_FragColor = texture2D(tDiffuse, vUv) * vign;
    }
  `
};
const vignetteMaterial = new THREE.ShaderMaterial(vignetteShader);

// Film grain shader
const grainShader = {
  uniforms: {
    tDiffuse: { value: null },
    grainIntensity: { value: 0.018 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float grainIntensity;
    varying vec2 vUv;
    void main() {
      vec4 color = texture2D(tDiffuse, vUv);
      float grain = grainIntensity * (0.5 - Math.random());
      color.r += grain; color.g += grain; color.b += grain;
      gl_FragColor = color;
    }
  `
};
const grainMaterial = new THREE.ShaderMaterial(grainShader);

function buildDungeonMeshes() {
  // Floor mesh

    color: 0x4a3d32, 
    side: THREE.DoubleSide 
  });

  const floorMatrix = new THREE.Matrix4();
  const floorQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
  const floorScale = new THREE.Vector3(1, 1, 1);
  const floorColor = new THREE.Color();
  
  floorCells.forEach(([x, y], i) => {
    floorMatrix.compose(new THREE.Vector3(x, 0, y), floorQuat, floorScale);

  props.forEach(p => {

          p.group.position.set(p.x, 0, p.y);
          scene.add(p.group);
        }

  });

// ==== Controls ====
const keys = { w: false, a: false, s: false, d: false, 
               ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
               space: false, enter: false };
let idleTicks = 0;
const IDLE_TIMEOUT = 180; // ~3 seconds at 60fps

function playerMove(dt) {
  const speed = 3.5 * dt;
  const dir = new THREE.Vector3(0, 0, 0);
  
  if (keys.w || keys.ArrowUp) dir.z -= 1;
  if (keys.s || keys.ArrowDown) dir.z += 1;
  if (keys.a || keys.ArrowLeft) dir.x -= 1;
  if (keys.d || keys.ArrowRight) dir.x += 1;
  
  if (dir.lengthSq() > 0) {
    dir.normalize();
    player.group.position.x += dir.x * speed;
    player.group.position.z += dir.z * speed;
    idleTicks = 0;
    
    // Sway torch with movement
    player.swayAngle += 0.25 * Math.abs(dir.x) + 0.15 * Math.abs(dir.z);
    torchFlame.rotation.x = Math.sin(player.swayAngle) * 0.12;
    torchFlame.rotation.y = Math.cos(player.swayAngle * 0.4) * 0.08;
    
    // Sword subtle swing while moving
    sword.rotation.z = 0.05 + Math.sin(player.swayAngle * 0.5) * 0.05;
  } else {
    idleTicks++;
    // When idle, sword returns to neutral and torch sways naturally
    sword.rotation.z = 0.05;
    player.swayAngle += 0.08;
    torchFlame.rotation.x = Math.sin(player.swayAngle) * 0.1;
    torchFlame.rotation.y = Math.cos(player.swayAngle * 0.5) * 0.05;
  }
  
  // Keep player in reasonable bounds (roughly the dungeon area)
  const bounds = 12;
  player.group.position.x = THREE.MathUtils.clamp(player.group.position.x, -bounds, bounds);
  player.group.position.z = THREE.MathUtils.clamp(player.group.position.z, -bounds, bounds);
  
  // Torch light follows player
  torchLight.position.x = player.group.position.x + (Math.random() - 0.5) * 1;
  torchLight.position.z = player.group.position.z + (Math.random() - 0.5) * 1;
  torchLight.position.y = 2 + Math.random() * 0.5;
}

// Attack function
function playerAttack() {
  if (player.attacking || player.attackCooldown > 0) return;
  player.attacking = true;
  player.attackCooldown = 0.4;
  idleTicks = 0;
  
  // Sword swing animation
  sword.rotation.z = 0.35;
  sword.material.color.setHex(0xff5555);
  
  // Check hits on monsters
  monsters.forEach(monster => {
    if (monster.dead || monster.collapse) return;
    const dx = Math.abs(monster.x - player.group.position.x);
    const dz = Math.abs(monster.y - player.group.position.z);
    // Attack arc: 1.5 units in front of player
    const attackRange = 1.5;
    if (dx < attackRange && dz < attackRange) {
      monster.takeDamage(1);
      if (!audioEnabled) playSFX('swordHit');
    }
  });
  
  // Reset sword after animation
  setTimeout(() => {
    sword.rotation.z = 0.05;
    sword.material.color.setHex(0x8b7d6b);
    player.attacking = false;
  }, 300);
}

// ==== Monster AI ====
function updateMonsters(dt) {
  monsters.forEach(monster => {
    if (monster.dead || monster.collapse) {
      // Remove dead monster after a delay
      if (monster.group) {
        monster.group.visible = false;
        // scene.remove(monster.group); // would be cleaner but we'll just hide
      }
      return;
    }
    
    // Distance to player
    const dx = player.group.position.x - monster.x;
    const dz = player.group.position.z - monster.y;
    const dist = Math.sqrt(dx*dx + dz*dz);
    
    // Monster notices hero within 10 tiles
    if (dist < 10) {
      // Approach player
      if (dist > 2.0) {
        const moveSpeed = 1.2 * dt;
        monster.x += (dx / dist) * moveSpeed;
        monster.y += (dz / dist) * moveSpeed;
        monster.group.position.set(monster.x, 0, monster.y);
      }
      
      // Occasional attack
      if (dist < 2.0 && Math.random() < 0.03 * dt) {
        // Player takes damage
        player.hitFlash = 0.5;
        if (player.invincible <= 0) {
          player.hp = Math.max(0, player.hp - 1);
          updateHUD();
          if (!audioEnabled) playSFX('squeal');
          player.invincible = 120; // 2 seconds invincibility
        }
      }
    }
  });
  
  // Clean up dead monsters
  for (let i = monsters.length - 1; i >= 0; i--) {
    if (monsters[i].dead) {
      monsters.splice(i, 1);
    }
  }
}

// Level descent function
function descendLevel() {
  player.level++;
  document.getElementById('depth').textContent = 'L' + player.level;
  
  // Spawn boss every third level
  if (player.level % 3 === 0) {
    spawnBoss();
  }
  
  // Generate new dungeon at deeper level
  generateNewDungeon();
  
  // Reset player position and state
  player.group.position.set(0, 0, 0);
  player.hp = player.maxHp;
  updateHUD();
  
  // Remove old monsters
  for (let i = monsters.length - 1; i >= 0; i--) {
    if (monsters[i].group) {
      monsters[i].group.visible = false;
      scene.remove(monsters[i].group);
    }
  }
  monsters.length = 0;
  
  // Reset key
  player.hasKey = false;
  if (keyGroup && keyGroup.visible) {
    keyGroup.visible = false;
  }
  
  // Update HUD
  document.getElementById('monsters').textContent = 'Monsters slain: 0';
  
  // Show hint
  document.getElementById('soundHint').textContent = 'new level - find key';
}

function spawnBoss(x, y) {
  // Create a boss monster - larger and tougher for boss levels
  const bossType = "skeleton";
  const boss = new Monster(bossType, x, y);
  boss.boss = true;
  boss.maxHp = player.level * 4 + 8;
  boss.hp = boss.maxHp;
  // Visual: larger size
  boss.group.scale.set(2, 2, 2);
  // Visual: glowing red eyes
  if (boss.leftEye) boss.leftEye.material.color.setHex(0xff0000);
  if (boss.rightEye) boss.rightEye.material.color.setHex(0xff0000);
  // Add crown indicator
  const crown = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.1, 0.5, 4, 4, 1),
    new THREE.MeshLambertMaterial({ color: 0xffd700 })
  );
  crown.position.y = 2.2;
  crown.rotation.x = -Math.PI / 2;
  boss.group.add(crown);
  // Increased damage
  boss.damage = 3;
  // Boss has more health and deals more damage
  boss.healthBar = {
    max: boss.maxHp,
    current: boss.hp
  };
  // Special attack: fireball
  boss.fireballCooldown = 0;
  // Spawn fireballs at player
  boss.spawnFireball = function() {
    const fbGeo = new THREE.SphereGeometry(0.3, 12, 12);
    const fbMat = new THREE.MeshLambertMaterial({ color: 0xff6600 });
    const fireball = new THREE.Mesh(fbGeo, fbMat);
    const dx = player.group.position.x - boss.x;
    const dz = player.group.position.z - boss.y;
    fireball.position.set(boss.x, 0.5, boss.y);
    scene.add(fireball);
    // Animate toward player
    const start = performance.now();
    function animateFB() {
      const elapsed = performance.now() - start;
      const progress = Math.min(elapsed / 500, 1);
      fireball.position.x = THREE.MathUtils.lerp(boss.x, player.group.position.x, progress);
      fireball.position.z = THREE.MathUtils.lerp(boss.y, player.group.position.z, progress);
      fireball.scale.multiplyScalar(1 - progress);
      if (progress < 1) {
        requestAnimationFrame(animateFB);
      } else {
        scene.remove(fireball);
      }
    }
    requestAnimationFrame(animateFB);
  };
  // Add fireball spawn timer
  boss.fireballTimer = 0;
  return boss;
}

function generateNewDungeon() {
  // Reset dungeon data
  floorCells.length = 0;
  wallCells.length = 0;
  props.length = 0;
  monsterSpawns.length = 0;

  player.gold = 0;

  // Re-generate room-and-corridor dungeon
  for (let y = 0; y < DH; y++) {
    for (let x = 0; x < DW; x++) {
      floorCells.push([x, y]);
    }
  }
  
  // Carve out rooms
  const rooms = [];
  for (let i = 0; i < 8; i++) {
    const w = 3 + Math.floor(Math.random() * 6);
    const h = 2 + Math.floor(Math.random() * 4);
    const rx = 1 + Math.floor(Math.random() * (DW - w - 1));
    const ry = 1 + Math.floor(Math.random() * (DH - h - 1));
    rooms.push({ x: rx, y: ry, w, h });
  }
  
  // Mark wall cells
  for (let y = 0; y < DH; y++) {
    for (let x = 0; x < DW; x++) {
      const isFloor = floorCells.some(c => c[0] === x && c[1] === y);
      if (!isFloor) continue;
      const neighborCount = (function() {
        let nc = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < DW && ny >= 0 && ny < DH && floorCells.some(c => c[0] === nx && c[1] === ny)) nc++;
          }
        }
        return nc;
      })();
      if (neighborCount <= 3) {
        wallCells.push([x, y]);
      }
    }
  }
  
  // Add props with level scaling

  }
  
  const crateCount = 10 + Math.floor(player.level / 3);
  for (let i = 0; i < crateCount; i++) {
    const cx = Math.floor(Math.random() * DW);
    const cy = Math.floor(Math.random() * DH);

      group.add(crate);

        lid.position.y = 0.55;
        group.add(lid);
      }
      props.push({ type: 'crate', x: cx, y: cy, group });
    }
  }
  
  // Pillars
  for (let y = 0; y < DH; y += 4) {
    for (let x = 0; x < DW; x += 4) {
      if (floorCells.some(c => c[0] === x && c[1] === y)) {
        const group = new THREE.Group();
        const pillar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.3, 0.3, 1.7, 12, 12),

        );
        pillar.position.y = 0.85;
        group.add(pillar);
        const capital = new THREE.Mesh(
          new THREE.SphereGeometry(0.32, 12, 12),

        );
        capital.position.y = 1.75;
        group.add(capital);
        props.push({ type: 'pillar', x: x, y: y, group });
      }
    }
  }
  
  // Stairs down (bottom-right area)
  {
    const stairsX = DW - 3;
    const stairsY = DH - 3;
    if (floorCells.some(c => c[0] === stairsX && c[1] === stairsY)) {
      const stairGroup = new THREE.Group();
      for (let yy = -1; yy <= 1; yy++) {

            const step = new THREE.Mesh(
              new THREE.BoxGeometry(TILE * 0.85, TILE * 0.18, TILE * 0.85),

            );
            step.position.set(xx * TILE * 0.87, TILE * 0.09 * Math.abs(yy), yy * TILE * 0.87);
            stairGroup.add(step);
          }

      }
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 2.2, TILE * 0.1, TILE * 0.2),
        new THREE.MeshLambertMaterial({ color: 0x8b7d6b })
      );
      rail.position.set(0, TILE * 0.05, 0);
      stairGroup.add(rail);
      props.push({ type: 'stairs', x: stairsX, y: stairsY, group: stairGroup });
    }
  }
  
  // Monsters (scaled for deeper levels)
  const monsterCount = Math.max(3, 3 + Math.floor(player.level / 2));
  const monsterTypes = ['skeleton', 'rat', 'slime'];
  for (let i = 0; i < monsterCount; i++) {
    const type = monsterTypes[i % 3];
    const bx = Math.floor(Math.random() * DW);
    const by = Math.floor(Math.random() * DH);
    if (floorCells.some(c => c[0] === bx && c[1] === by)) {
      const m = new Monster(type, bx, by);
      m.group.userData = { type: type, x: bx, y: by, monster: m };
      monsters.push(m);
      monsterSpawns.push({ type: type, x: bx, y: by });
    }
  }
  
  // Key spawn
  const keyX = Math.floor(Math.random() * DW);
  const keyY = Math.floor(Math.random() * DH);
  if (floorCells.some(c => c[0] === keyX && c[1] === keyY)) {
    const keyGroup = new THREE.Group();
    const keyBowl = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.2, 0.3, 8, 8),
      new THREE.MeshLambertMaterial({ color: 0xc8a500 })
    );
    keyBowl.position.y = 0.15;
    keyGroup.add(keyBowl);
    for (let i = 0; i < 4; i++) {
      const tooth = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, 0.15, 0.3, 4, 4, 1),
        new THREE.MeshLambertMaterial({ color: 0x8b6a1b })
      );
      tooth.position.set(
        Math.sin(i * Math.PI / 2) * 0.18,
        0.2 + Math.cos(i * Math.PI / 2) * 0.05,
        (i % 2 === 0 ? -0.2 : 0.2)
      );
      keyGroup.add(tooth);
    }
    const keyRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.25, 0.08, 8, 24, Math.PI),
      new THREE.MeshLambertMaterial({ color: 0xc8a500 })
    );
    keyRing.position.y = 0.3;
    keyRing.rotation.x = Math.PI / 2;
    keyGroup.add(keyRing);
    keyGroup.position.set(keyX, 0, keyY);
    scene.add(keyGroup);
    props.push({ type: 'key', x: keyX, y: keyY, group: keyGroup });
    dungeon.keyX = keyX;
    dungeon.keyY = keyY;
  } else {
    dungeon.keyX = keyX;
    dungeon.keyY = keyY;
  }
  
  // Wooden doors (3 doors, first one locked as key door)
  const doorCount = 3;
  for (let i = 0; i < doorCount; i++) {
    const dx = Math.floor(Math.random() * (DW - 4)) + 2;
    const dy = Math.floor(Math.random() * (DH - 4)) + 2;
    if (floorCells.some(c => c[0] === dx && c[1] === dy)) {
      const group = new THREE.Group();
      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(TILE * 0.95, 1.2, 0.1, 6, 6, 1),
        new THREE.MeshLambertMaterial({ color: 0x5a4a30 })
      );
      frame.position.y = 0.6;
      group.add(frame);
      for (let j = 0; j < 3; j++) {
        const panel = new THREE.Mesh(
          new THREE.BoxGeometry(TILE * 0.3, 1.0, 0.05, 6, 6, 1),
          new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
        );
        panel.position.set(0, 0.5, (j - 1) * TILE * 0.35);
        panel.rotation.y = (j % 2 === 0) ? Math.PI / 2 : 0;
        group.add(panel);
      }
      const isLocked = (i === 0);
      group.position.set(dx, 0, dy);
      props.push({ type: 'woodenDoor', x: dx, y: dy, group, locked: isLocked });
    }
  }
  
  // Rebuild dungeon meshes
  buildDungeonMeshes();
  
  // Return updated dungeon reference
  return { floorCells, wallCells, monsterSpawns, props };
}
}

// Start game loop
requestAnimationFrame(gameLoop);

// ==== Controls ====
window.addEventListener('keydown', (e) => {
  if (e.key === 'w' || e.key === 'W') keys.w = true;
  if (e.key === 's' || e.key === 'S') keys.s = true;
  if (e.key === 'a' || e.key === 'A') keys.a = true;
  if (e.key === 'd' || e.key === 'D') keys.d = true;
  if (e.key === 'ArrowUp') keys.ArrowUp = true;
  if (e.key === 'ArrowDown') keys.ArrowDown = true;
  if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
  if (e.key === 'ArrowRight') keys.ArrowRight = true;
  if (e.key === ' ') {
    e.preventDefault();
    keys.space = true;
    ensureAudio();
    playerAttack();
  }
  if (e.key === 'c' || e.key === 'C') {
    // Toggle audio
    toggleAudio();
  }
  if (e.key === 'e' || e.key === 'E') {
    ensureAudio();
    // Key collection: if player is over key grid position
    if (player.hasKey) {
      // Already have key, try to unlock door
      if (dungeon && dungeon.woodenDoors) {
        for (const dd of dungeon.woodenDoors) {
          if (dd.locked && Math.abs(dd.x - player.group.position.x) < 1 && Math.abs(dd.y - player.group.position.z) < 1) {
            dd.locked = false;
            if (!audioEnabled) playSFX('unlock');
            document.getElementById('soundHint').textContent = 'door unlocked';
            // Door unlocked - player can now descend
            // Descent triggered when player presses E at the unlocked door
          }
        }
      }
    } else {
      // Try to pick up key
      if (dungeon && dungeon.keyX !== undefined) {
        if (Math.abs(dungeon.keyX - player.group.position.x) < 1 && Math.abs(dungeon.keyY - player.group.position.z) < 1) {
          player.hasKey = true;
          // Remove key from scene
          if (keyGroup && keyGroup.visible) {
            keyGroup.visible = false;
          }
          document.getElementById('soundHint').textContent = 'key obtained';
        }
      }
    }
  }
  if (e.key === 'q' || e.key === 'Q') {
    ensureAudio();
    // Drink potion if player has one
    if (player.potionType && player.potionCharges > 0) {
      player.potionCharges--;
      // Apply potion effects
      if (player.potionType === 'health') {
        player.hp = Math.min(player.maxHp, player.hp + 2);
        document.getElementById('soundHint').textContent = 'drank potion: health restored';
      } else if (player.potionType === 'strength') {
        player.damage = Math.max(1, player.damage - 1);
        document.getElementById('soundHint').textContent = 'drank potion: strength';
      } else if (player.potionType === 'speed') {
        player.speed = Math.max(1, player.speed - 0.2);
        document.getElementById('soundHint').textContent = 'drank potion: speed';
      }
      player.potionCharges--;
      // Update HUD
      document.getElementById('potionType').textContent = 'None';
      document.getElementById('potionIcon').style.display = 'none';
      if (player.potionCharges <= 0) {
        player.potionType = null;
      }
    } else {
      document.getElementById('soundHint').textContent = 'no potion';
    }
  }
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'w' || e.key === 'W') keys.w = false;
  if (e.key === 's' || e.key === 'S') keys.s = false;
  if (e.key === 'a' || e.key === 'A') keys.a = false;
  if (e.key === 'd' || e.key === 'D') keys.d = false;
  if (e.key === 'ArrowUp') keys.ArrowUp = false;
  if (e.key === 'ArrowDown') keys.ArrowDown = false;
  if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
  if (e.key === 'ArrowRight') keys.ArrowRight = false;
  if (e.key === ' ') keys.space = false;
});

// Gamepad support
function updateGamepads() {
  if (!navigator.gamepads) return;
  const gp = navigator.gamepads[0];
  if (!gp) return;
  
  // Left stick Y: forward (up is negative on many APIs, but check)
  if (gp.axes) {
    const y = gp.axes[1]; // left stick Y
    const x = gp.axes[0];
    if (y < -0.5) { keys.w = true; keys.s = false; }
    if (y > 0.5) { keys.s = true; keys.w = false; }
    if (x < -0.5) { keys.a = true; keys.d = false; }
    if (x > 0.5) { keys.d = true; keys.a = false; }
  }
  
  // Buttons: 0 = cross/A, 2 = X, 1 = circle/B, 3 = square/Y
  if (gp.buttons) {
    if (gp.buttons[0] && gp.buttons[0].pressed) {
      ensureAudio();
      playerAttack();
    }
    if (gp.buttons[2] && gp.buttons[2].pressed) {
      toggleAudio();
    }
  }
}

// Poll gamepads periodically
setInterval(updateGamepads, 50);

// Resize handling
window.addEventListener('resize', () => {
  const width = window.innerWidth;
  const height = window.innerHeight;
  renderer.setSize(width, height);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  
  // Update render target sizes
  renderTarget.setSize(Math.max(1, Math.floor(width / 2)), Math.max(1, Math.floor(height / 2)));
  fullTarget.setSize(width, height);
  
  // Update tilt-shift uniforms
  tiltShiftShader.uniforms.screenH.value = height;
});

// Initialize HUD
updateHUD();

// Ensure audio works after first user gesture
document.getElementById('soundHint').addEventListener('click', () => {
  ensureAudio();
  toggleAudio();
});

// Auto-enable audio after a short delay (browser policy)
setTimeout(ensureAudio, 500);

console.log('TORCHLIGHT DEPTHS - loading complete');
</script>
