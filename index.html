<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<body>
<canvas id="canvas"></canvas>
<div class="hud" id="hud">
  <div class="header">TORCHLIGHT DEPTHS</div>
  <div class="row hearts" id="hearts">&hearts;&hearts;&hearts;&hearts;&hearts;</div>
  <div class="row">HP: <span id="hp">5</span>/<span id="maxHp">5</span></div>
  <div class="row">Gold: <span id="gold" class="gold">0</span> &nbsp; Depth: <span id="depth" class="depth">L1</span></div>
  <div class="row">Monsters slain: <span id="monsters">0</span></div>
  <div class="row potion" id="potionHud">Potions: <span id="potionCount">1</span> <span style="color:#6a6a6a">[Q]</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { mergeBufferGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================== CORE SETUP ==============================
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
const BG = new THREE.Color(0x0a0b10);
scene.background = BG;
scene.fog = new THREE.Fog(BG, 14, 40);

// Isometric-style camera: classic three-quarter angle, smooth follow
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
const CAM_OFFSET = new THREE.Vector3(10.5, 13.5, 10.5);
camera.position.copy(CAM_OFFSET);
camera.lookAt(0, 0, 0);

const ambient = new THREE.HemisphereLight(0x2c3b52, 0x0b0d12, 0.55);
scene.add(ambient);

// Hero torch: warm flickering point light + a shadow-casting spot "torch cone"
// that follows the hero, so shadows of monsters/props/pillars really move.
const torchLight = new THREE.PointLight(0xffa04a, 2.1, 13, 1.6);
scene.add(torchLight);

const torchSpot = new THREE.SpotLight(0xffb464, 1.6, 26, 0.72, 0.55, 1.2);
torchSpot.castShadow = true;
torchSpot.shadow.mapSize.set(1024, 1024);
torchSpot.shadow.camera.near = 1.5;
torchSpot.shadow.camera.far = 30;
torchSpot.shadow.bias = -0.002;
scene.add(torchSpot);
scene.add(torchSpot.target);

// ============================== CONSTANTS / HELPERS ==============================
const TILE = 2.0;
const DW = 24;
const DH = 20;

const rnd  = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function cellToWorld(cx, cy) { return { x: (cx - DW / 2) * TILE, z: (cy - DH / 2) * TILE }; }

const _c = new THREE.Color();
function coloredBox(sx, sy, sz, x, y, z, r, g, b) {
  const geo = new THREE.BoxGeometry(sx, sy, sz);
  geo.translate(x, y, z);
  const n = geo.attributes.position.count;
  const col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { col[i*3] = r; col[i*3+1] = g; col[i*3+2] = b; }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}

// ============================== DUNGEON DATA ==============================
const grid = [];
let rooms = [];
let startCell = { x: 2, y: 2 };
let stairsCell = { x: DW - 3, y: DH - 3 };
let doorCell = null;
let keyCell = null;
let stairsRoom = null;

function isFloor(cx, cy) {
  return cx >= 0 && cy >= 0 && cx < DW && cy < DH && grid[cy][cx] === 1;
}

function generateDungeon(depth) {
  for (let y = 0; y < DH; y++) { grid[y] = []; for (let x = 0; x < DW; x++) grid[y][x] = 0; }
  rooms = [];
  const roomCount = 7 + Math.min(3, depth);
  for (let i = 0; i < 70 && rooms.length < roomCount; i++) {
    const w = rndi(4, 7), h = rndi(3, 5);
    const x = rndi(1, DW - w - 1), y = rndi(1, DH - h - 1);
    const r = { x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) };
    const overlap = rooms.some(o => x < o.x + o.w + 1 && x + w + 1 > o.x && y < o.y + o.h + 1 && y + h + 1 > o.y);
    if (!overlap) rooms.push(r);
  }
  for (const r of rooms) {
    for (let yy = r.y; yy < r.y + r.h; yy++) for (let xx = r.x; xx < r.x + r.w; xx++) grid[yy][xx] = 1;
  }
  const corridor = (a, b) => {
    let x = a.cx, y = a.cy;
    while (x !== b.cx) { grid[y][x] = 1; x += b.cx > x ? 1 : -1; }
    while (y !== b.cy) { grid[y][x] = 1; y += b.cy > y ? 1 : -1; }
    grid[y][x] = 1;
  };
  for (let i = 1; i < rooms.length; i++) corridor(rooms[i - 1], rooms[i]);
  for (let i = 0; i < 2; i++) corridor(pick(rooms), pick(rooms));

  startCell = { x: rooms[0].cx, y: rooms[0].cy };
  let best = 1, bd = -1;
  for (let i = 1; i < rooms.length; i++) {
    const d = Math.hypot(rooms[i].cx - startCell.x, rooms[i].cy - startCell.y);
    if (d > bd) { bd = d; best = i; }
  }
  stairsRoom = rooms[best];
  stairsCell = { x: stairsRoom.cx, y: stairsRoom.cy };
  // door on the ring just outside the stairs room, on a corridor cell
  doorCell = null;
  const ring = [];
  for (let xx = stairsRoom.x - 1; xx <= stairsRoom.x + stairsRoom.w; xx++)
    for (let yy = stairsRoom.y - 1; yy <= stairsRoom.y + stairsRoom.h; yy++) {
      const inside = xx >= stairsRoom.x && xx < stairsRoom.x + stairsRoom.w && yy >= stairsRoom.y && yy < stairsRoom.y + stairsRoom.h;
      if (!inside && isFloor(xx, yy)) ring.push({ x: xx, y: yy });
    }
  if (ring.length) doorCell = pick(ring);
  const keyRooms = rooms.filter((r, i) => i !== 0 && r !== stairsRoom);
  const keyRoom = keyRooms.length ? pick(keyRooms) : rooms[0];
  keyCell = { x: rndi(keyRoom.x, keyRoom.x + keyRoom.w - 1), y: rndi(keyRoom.y, keyRoom.y + keyRoom.h - 1) };
}

function reachableFrom(cx, cy) {
  const door = doorMesh && doorMesh.open;
  const seen = new Set([cx + ',' + cy]);
  const q = [[cx, cy]];
  while (q.length) {
    const [x, y] = q.shift();
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy, key = nx + ',' + ny;
      if (seen.has(key)) continue;
      if (isFloor(nx, ny) || (door && doorCell && nx === doorCell.x && ny === doorCell.y)) {
        seen.add(key); q.push([nx, ny]);
      }
    }
  }
  return seen;
}

// ============================== MATERIALS ==============================
const M = {
  stone:   new THREE.MeshLambertMaterial({ vertexColors: true }),
  wood:    new THREE.MeshLambertMaterial({ color: 0x5c3d21 }),
  woodDark:new THREE.MeshLambertMaterial({ color: 0x3d2814 }),
  iron:    new THREE.MeshLambertMaterial({ color: 0x4a5058 }),
  bone:    new THREE.MeshLambertMaterial({ color: 0xd8cfae }),
  rock:    new THREE.MeshLambertMaterial({ color: 0x5a5f66 }),
  cloth:   new THREE.MeshLambertMaterial({ color: 0x7a2723, side: THREE.DoubleSide }),
  clothB:  new THREE.MeshLambertMaterial({ color: 0x274e7a, side: THREE.DoubleSide }),
  gold:    new THREE.MeshLambertMaterial({ color: 0xe8b13a, emissive: 0x664400 }),
  potion:  new THREE.MeshLambertMaterial({ color: 0xc23b2e, emissive: 0x330805 }),
  flame:   new THREE.MeshBasicMaterial({ color: 0xffb347 }),
  flameHot:new THREE.MeshBasicMaterial({ color: 0xffe08a }),
  goo:     new THREE.MeshLambertMaterial({ color: 0x5fae3f }),
  splat:   new THREE.MeshLambertMaterial({ color: 0x33551f }),
  slime:   new THREE.MeshPhongMaterial({ color: 0x6fce4e, shininess: 70, transparent: true, opacity: 0.92 }),
  rat:     new THREE.MeshLambertMaterial({ color: 0x6b5138 }),
  ratDark: new THREE.MeshLambertMaterial({ color: 0x40301e }),
  eyeRed:  new THREE.MeshBasicMaterial({ color: 0xff4020 }),
  eyeBlue: new THREE.MeshBasicMaterial({ color: 0x66ccff }),
  eyeGreen:new THREE.MeshBasicMaterial({ color: 0x9cff40 }),
  water:   new THREE.MeshPhongMaterial({ color: 0x18324a, shininess: 90, specular: 0x88aaff }),
  metal:   new THREE.MeshPhongMaterial({ color: 0x8a9099, shininess: 60, specular: 0xaabbcc }),
  rug:     new THREE.MeshLambertMaterial({ color: 0x6e2f3a }),
};

// ============================== LEVEL BUILD ==============================
const levelGroup = new THREE.Group();
scene.add(levelGroup);
let torchSpots = [];
let chestList = [];
let pickups = [];
let doorMesh = null;
let stairsPos = { x: 0, z: 0 };
let propBlocks = [];
let torchGroups = [];

function clearLevel() {
  levelGroup.traverse(o => { if (o.isMesh && o.userData.own) o.geometry.dispose(); });
  levelGroup.clear();
  torchSpots = []; chestList = []; pickups = []; doorMesh = null; propBlocks = []; torchGroups = [];
}

function buildFloorWalls(depth) {
  const specs = [];
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
    if (grid[y][x] !== 1) continue;
    const { x: wx, z: wz } = cellToWorld(x, y);
    const t = rnd(-0.06, 0.06);
    let r = 0.30 + t, g = 0.315 + t, b = 0.34 + t * 0.8;
    if (Math.random() < 0.05) { r = 0.22; g = 0.31; b = 0.22; } // mossy tile
    specs.push(coloredBox(TILE, 0.18, TILE, wx, -0.09, wz, r, g, b));
  }
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
    if (grid[y][x] !== 0) continue;
    let touching = false, front = false;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      if (isFloor(x + dx, y + dy)) {
        touching = true;
        if ((dx === -1 && dy === 0) || (dx === 0 && dy === -1)) front = true;
      }
    }
    if (!touching) continue;
    const { x: wx, z: wz } = cellToWorld(x, y);
    const s = 0.16 + rnd(-0.045, 0.045);
    const r = s, g = s + 0.012, b = s + 0.032;
    if (front) {
      // low cut-away walls keep the isometric interior always visible
      specs.push(coloredBox(TILE, 0.5, TILE, wx, 0.25, wz, r, g, b));
      specs.push(coloredBox(TILE * 1.02, 0.14, TILE * 1.02, wx, 0.56, wz, r * 1.3, g * 1.3, b * 1.3));
    } else {
      const h = rnd(2.4, 2.9);
      specs.push(coloredBox(TILE, h, TILE, wx, h / 2, wz, r, g, b));
      if (Math.random() < 0.25) specs.push(coloredBox(TILE * 1.04, 0.22, TILE * 1.04, wx, h + 0.1, wz, r * 0.8, g * 0.8, b * 0.8));
    }
  }
  const merged = mergeBufferGeometries(specs, false);
  merged.userData = {};
  const mesh = new THREE.Mesh(merged, M.stone);
  mesh.receiveShadow = true;
  levelGroup.add(mesh);
}

function addTorch(wx, y, wz, withLight) {
  const g = new THREE.Group();
  const sconce = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.14), M.iron);
  g.userData.own = true;
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.42, 6), M.woodDark);
  handle.position.y = 0.22;
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.3, 6), M.flame);
  flame.position.y = 0.52;
  const core = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.18, 6), M.flameHot);
  core.position.y = 0.5;
  g.add(sconce, handle, flame, core);
  g.position.set(wx, y, wz);
  if (withLight) {
    const pl = new THREE.PointLight(0xff9840, withLight === 'big' ? 1.05 : 0.75, withLight === 'big' ? 9 : 6.5, 1.7);
    pl.position.set(0, 0.55, 0);
    g.add(pl);
    g.userData.light = pl;
    g.userData.flame = flame;
  }
  levelGroup.add(g);
  torchGroups.push(g);
  torchSpots.push(new THREE.Vector3(wx, y + 0.55, wz));
}

function addChest(cx, cy) {
  const { x, z } = cellToWorld(cx, cy);
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.32, 0.42), M.wood);
  base.position.y = 0.16;
  const lid = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.18, 0.4), M.woodDark);
  lid.position.set(0, 0.38, 0);
  const band = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.06, 0.44), M.iron);
  band.position.y = 0.26;
  g.add(base, lid, band);
  g.position.set(x, 0, z);
  g.rotation.y = rnd(0, Math.PI * 2);
  levelGroup.add(g);
  chestList.push({ group: g, lid, opened: false });
  pickups.push({ type: 'chest', x, z, taken: false, chest: chestList[chestList.length - 1] });
  propBlocks.push({ x, z, r: 0.55 });
}

function spawnPickup(type, x, z) {
  const g = new THREE.Group();
  g.userData.own = true;
  if (type === 'gold') {
    for (let i = 0; i < rndi(2, 4); i++) {
      const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.035, 10), M.gold);
      coin.position.set(rnd(-0.12, 0.12), 0.05, rnd(-0.12, 0.12));
      coin.rotation.x = Math.PI / 2;
      g.add(coin);
    }
  } else if (type === 'potion') {
    const flask = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 0.2, 8), M.potion);
    flask.position.y = 0.12;
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 6), M.iron);
    neck.position.y = 0.26;
    g.add(flask, neck);
  } else if (type === 'key') {
    const bowl = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.025, 6, 12), M.gold);
    bowl.position.y = 0.3; bowl.rotation.x = Math.PI / 2;
    const stem = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.18, 0.03), M.gold);
    stem.position.y = 0.17;
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.03, 0.03), M.gold);
    tooth.position.set(0.035, 0.11, 0);
    g.add(bowl, stem, tooth);
    g.userData.spin = true;
  }
  g.position.set(x, 0, z);
  g.userData.bob = Math.random() * Math.PI * 2;
  levelGroup.add(g);
  pickups.push({ type, x, z, group: g, taken: false });
}

function randomFloorCell(minDistFromStart = 0) {
  const cells = [];
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
    if (grid[y][x] === 1 && Math.hypot(x - startCell.x, y - startCell.y) >= minDistFromStart &&
        !(Math.abs(x - startCell.x) <= 1 && Math.abs(y - startCell.y) <= 1)) cells.push({ x, y });
  }
  return cells.length ? pick(cells) : null;
}

function buildProps(depth) {
  const barrelGeo = new THREE.CylinderGeometry(0.26, 0.3, 0.62, 10);
  const crateGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const rubbleGeo = new THREE.DodecahedronGeometry(0.16, 0);
  const boneGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.4, 5);
  const skullGeo = new THREE.SphereGeometry(0.11, 8, 6);
  const pillarGeo = new THREE.CylinderGeometry(0.32, 0.38, 2.6, 8);
  const capGeo = new THREE.BoxGeometry(0.85, 0.18, 0.85);
  const webGeo = new THREE.PlaneGeometry(0.9, 0.9);
  const webMat = new THREE.MeshLambertMaterial({ color: 0x8a94a0, transparent: true, opacity: 0.22, side: THREE.DoubleSide });
  const bannerGeo = new THREE.PlaneGeometry(0.6, 1.2);
  const spikeGeo = new THREE.ConeGeometry(0.06, 0.22, 6);

  const put = (mesh, cell, y = 0, solid = true) => {
    const { x, z } = cellToWorld(cell.x, cell.y);
    mesh.position.set(x + rnd(-0.25, 0.25), y, z + rnd(-0.25, 0.25));
    mesh.rotation.y = rnd(0, Math.PI * 2);
    levelGroup.add(mesh);
    if (solid) propBlocks.push({ x: mesh.position.x, z: mesh.position.z, r: 0.5 });
    return mesh;
  };

  for (let i = 0; i < 10; i++) { const c = randomFloorCell(); if (c) put(new THREE.Mesh(barrelGeo, M.wood), c); }
  for (let i = 0; i < 8; i++) { const c = randomFloorCell(); if (c) put(new THREE.Mesh(crateGeo, M.woodDark), c); }
  for (let i = 0; i < 12; i++) { const c = randomFloorCell(); if (c) put(new THREE.Mesh(rubbleGeo, M.rock), c, 0.12, false); }
  for (let i = 0; i < 6; i++) {
    const c = randomFloorCell(); if (!c) continue;
    const g = new THREE.Group();
    const b1 = new THREE.Mesh(boneGeo, M.bone); b1.rotation.z = 1.4; b1.position.y = 0.06;
    const b2 = new THREE.Mesh(boneGeo, M.bone); b2.rotation.set(1.2, 0.5, 0); b2.position.set(0.1, 0.05, 0.05);
    const sk = new THREE.Mesh(skullGeo, M.bone); sk.scale.y = 0.8; sk.position.set(-0.14, 0.09, 0.06);
    g.add(b1, b2, sk);
    put(g, c, 0, false);
  }
  for (let i = 0; i < 4; i++) {
    const c = randomFloorCell(); if (!c) continue;
    const p = new THREE.Mesh(pillarGeo, M.rock); p.position.y = 1.3; p.castShadow = true;
    const cap = new THREE.Mesh(capGeo, M.rock); cap.position.y = 2.7;
    const g = new THREE.Group(); g.add(p, cap); g.userData.own = true;
    put(g, c);
  }
  for (let i = 0; i < 5; i++) {
    const c = randomFloorCell(); if (!c) continue;
    const w = new THREE.Mesh(webGeo, webMat);
    put(w, c, rnd(0.3, 1.8), false);
    w.rotation.set(rnd(-0.3, 0.3), rnd(0, Math.PI), rnd(-0.3, 0.3));
  }
  for (let i = 0; i < 4; i++) {
    const c = randomFloorCell(); if (!c) continue;
    const b = new THREE.Mesh(bannerGeo, Math.random() < 0.5 ? M.cloth : M.clothB);
    put(b, c, rnd(1.2, 2.0), false);
    b.rotation.set(-0.08, rnd(0, Math.PI * 2), 0);
  }
  for (let i = 0; i < 3; i++) {
    const c = randomFloorCell(); if (!c) continue;
    const g = new THREE.Group();
    const plate = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.06, 0.8), M.iron);
    plate.position.y = 0.11;
    g.add(plate);
    for (let s = 0; s < 9; s++) {
      const sp = new THREE.Mesh(spikeGeo, M.metal);
      sp.position.set(rnd(-0.3, 0.3), 0.24, rnd(-0.3, 0.3));
      g.add(sp);
    }
    put(g, c, 0, false);
  }
  for (let i = 0; i < 3; i++) {
    const c = randomFloorCell(); if (!c) continue;
    const p = new THREE.Mesh(new THREE.CircleGeometry(rnd(0.25, 0.45), 12), M.water);
    p.rotation.x = -Math.PI / 2;
    put(p, c, 0.1, false);
  }
  for (let i = 0; i < 2; i++) {
    const c = randomFloorCell(); if (!c) continue;
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.1, 8), M.rock);
    base.position.y = 0.05;
    const rune = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.03, 6, 12), M.eyeBlue);
    rune.rotation.x = Math.PI / 2; rune.position.y = 0.12;
    const l = new THREE.PointLight(0x4488ff, 0.55, 4.5, 1.8);
    l.position.y = 0.5;
    g.add(base, rune, l);
    put(g, c, 0, false);
    torchSpots.push(new THREE.Vector3(g.position.x, 0.3, g.position.z));
  }
}

function buildTorchesAndStairs(depth) {
  // sconces on back walls
  let placed = 0;
  for (let y = 0; y < DH && placed < 6; y++) for (let x = 0; x < DW && placed < 6; x++) {
    if (grid[y][x] !== 0) continue;
    const floorBelow = isFloor(x, y - 1);
    const floorLeft = isFloor(x - 1, y);
    if ((floorBelow || floorLeft) && x + y > 4 && Math.random() < 0.5) {
      const big = placed % 2 === 0;
      const { x: wx, z: wz } = cellToWorld(x, y);
      addTorch(wx + (floorBelow ? 0 : -TILE * 0.55), big ? 1.9 : 1.7, wz + (floorBelow ? -TILE * 0.55 : 0), big ? 'big' : true);
      placed++;
    }
  }
  // stairs down
  const g = new THREE.Group();
  const { x: sx, z: sz } = cellToWorld(stairsCell.x, stairsCell.y);
  for (let s = 0; s < 4; s++) {
    const step = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.22, 0.5), M.stone);
    step.position.set(0, 1.0 - s * 0.28, -0.05 - s * 0.42);
    g.add(step);
  }
  const hole = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.0), new THREE.MeshBasicMaterial({ color: 0x02030a }));
  hole.rotation.x = -Math.PI / 2;
  hole.position.set(0, -0.02, -0.9);
  g.add(hole);
  g.position.set(sx, 0, sz);
  g.rotation.y = rnd(0, Math.PI);
  levelGroup.add(g);
  stairsPos = { x: sx, z: sz };
  propBlocks.push({ x: sx, z: sz, r: 0.9 });
  const glow = new THREE.PointLight(0x2244aa, 0.4, 5, 1.8);
  glow.position.set(sx, 1, sz);
  levelGroup.add(glow);

  // locked wooden door on the stairs-room approach
  if (doorCell) {
    const { x: dx, z: dz } = cellToWorld(doorCell.x, doorCell.y);
    const dg = new THREE.Group();
    const panel = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.7, 0.16), M.wood);
    panel.position.y = 0.85;
    const band1 = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.12, 0.18), M.iron);
    band1.position.y = 1.3;
    const band2 = band1.clone(); band2.position.y = 0.45;
    const hasp = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.24, 0.2), M.iron);
    hasp.position.set(0.3, 0.95, 0.05);
    const lockGlow = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.02, 5, 8), M.eyeRed);
    lockGlow.position.set(0.3, 0.85, 0.1);
    dg.add(panel, band1, band2, hasp, lockGlow);
    dg.position.set(dx, 0, dz);
    dg.rotation.y = (isFloor(doorCell.x, doorCell.y - 1) || isFloor(doorCell.x, doorCell.y + 1)) ? Math.PI / 2 : 0;
    levelGroup.add(dg);
    doorMesh = { group: dg, panel, hasp, lockGlow, open: false, x: dx, z: dz };
    propBlocks.push({ x: dx, z: dz, r: 0.75 });
  }
  // chests with loot
  const roomPool = rooms.filter(r => r !== stairsRoom);
  const nChests = rndi(3, 4);
  for (let i = 0; i < nChests && roomPool.length; i++) {
    const r = pick(roomPool);
    addChest(rndi(r.x, r.x + r.w - 1), rndi(r.y, r.y + r.h - 1));
  }
  // key
  const kw = cellToWorld(keyCell.x, keyCell.y);
  spawnPickup('key', kw.x, kw.z);
  // scattered gold & potions
  for (let i = 0; i < 4; i++) {
    const c = randomFloorCell(); if (!c) continue;
    const { x, z } = cellToWorld(c.x, c.y);
    spawnPickup('gold', x + rnd(-0.4, 0.4), z + rnd(-0.4, 0.4));
  }
  for (let i = 0; i < 2; i++) {
    const c = randomFloorCell(); if (!c) continue;
    const { x, z } = cellToWorld(c.x, c.y);
    spawnPickup('potion', x + rnd(-0.4, 0.4), z + rnd(-0.4, 0.4));
  }
}

function spawnMonster(kind, cx, cy) {
  const depth = hero.depth;
  const { x, z } = cellToWorld(cx, cy);
  const { group, parts } = buildMonster(kind);
  group.position.set(x, 0, z);
  levelGroup.add(group);
  const stats = {
    skeleton: { hp: 2 + Math.floor(depth / 4), spd: 1.35, dmg: 1, range: 1.0 },
    rat:      { hp: 1 + Math.floor(depth / 5), spd: 1.9,  dmg: 1, range: 0.9 },
    slime:    { hp: 3 + Math.floor(depth / 4), spd: 0.85, dmg: 1, range: 0.95 },
    boss:     { hp: 8 + depth * 2, spd: 1.2, dmg: 2, range: 1.35 },
  }[kind];
  const m = {
    kind, group, parts, hp: stats.hp, maxHp: stats.hp, spd: stats.spd, dmg: stats.dmg,
    range: stats.range, alive: true, dead: false, deathT: 0,
    cooldown: rnd(0.3, 1), wanderTarget: null, flash: 0, boss: kind === 'boss',
    wobPhase: rnd(0, 10), knockback: null,
  };
  monsters.push(m);
  return m;
}

function spawnPlanFor(depth) {
  const list = [];
  for (let i = 0; i < rndi(4, 5); i++) list.push(pick(MON_KINDS));
  if (depth % 3 === 0) list.push('boss');
  return list;
}

function populateMonsters(depth) {
  const plan = spawnPlanFor(depth);
  // two close to the player so the first fight starts fast
  const near = [[2, 1], [1, 2], [2, 2], [3, 1], [1, 3], [3, 2]]
    .map(([dx, dy]) => ({ x: startCell.x + dx, y: startCell.y + dy }))
    .filter(c => isFloor(c.x, c.y));
  for (let i = 0; i < plan.length; i++) {
    const spot = i < 2 && near.length ? near[i] : randomFloorCell(5) || { x: startCell.x + 2, y: startCell.y + 1 };
    if (isFloor(spot.x, spot.y)) spawnMonster(plan[i], spot.x, spot.y);
  }
}

// ============================== AUDIO (Web Audio synth) ==============================
const audio = { ctx: null, started: false };
function initAudio() {
  if (audio.started) return;
  audio.started = true;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    audio.ctx = ctx;
    const master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    audio.master = master;
    const drone = ctx.createOscillator(); drone.type = 'sine'; drone.frequency.value = 55;
    const drone2 = ctx.createOscillator(); drone2.type = 'triangle'; drone2.frequency.value = 55.7;
    const droneGain = ctx.createGain(); droneGain.gain.value = 0.04;
    const droneFilter = ctx.createBiquadFilter(); droneFilter.type = 'lowpass'; droneFilter.frequency.value = 160;
    drone.connect(droneFilter); drone2.connect(droneFilter); droneFilter.connect(droneGain); droneGain.connect(master);
    drone.start(); drone2.start();
    const len = ctx.sampleRate * 2;
    const noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource(); noise.buffer = noiseBuf; noise.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.8;
    const crackleGain = ctx.createGain(); crackleGain.gain.value = 0.012;
    noise.connect(bp); bp.connect(crackleGain); crackleGain.connect(master);
    noise.start();
    audio.noiseBuf = noiseBuf;
  } catch (e) { /* audio is optional */ }
}
function sfx(type) {
  if (!audio.ctx) return;
  const ctx = audio.ctx, t = ctx.currentTime;
  const g = ctx.createGain(); g.connect(audio.master);
  if (type === 'swing') {
    const src = ctx.createBufferSource(); src.buffer = audio.noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(3200, t + 0.12);
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    src.connect(f); f.connect(g); src.start(t); src.stop(t + 0.18);
  } else if (type === 'hit') {
    const o = ctx.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.1);
    g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); o.start(t); o.stop(t + 0.13);
  } else if (type === 'hurt') {
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.18);
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); o.start(t); o.stop(t + 0.21);
  } else if (type === 'die') {
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.4);
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(g); o.start(t); o.stop(t + 0.46);
  } else if (type === 'pickup') {
    [880, 1320].forEach((f0, i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f0;
      const gg = ctx.createGain(); gg.gain.setValueAtTime(0.07, t + i * 0.07); gg.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.09);
      o.connect(gg); gg.connect(audio.master); o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.1);
    });
  } else if (type === 'potion') {
    [520, 660, 780].forEach((f0, i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f0;
      const gg = ctx.createGain(); gg.gain.setValueAtTime(0.06, t + i * 0.06); gg.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.1);
      o.connect(gg); gg.connect(audio.master); o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.12);
    });
  } else if (type === 'door') {
    const src = ctx.createBufferSource(); src.buffer = audio.noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(300, t); f.frequency.linearRampToValueAtTime(900, t + 0.5);
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    src.connect(f); f.connect(g); src.start(t); src.stop(t + 0.62);
  } else if (type === 'stairs') {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + 1.1);
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    o.connect(g); o.start(t); o.stop(t + 1.25);
  }
}

function gamepadState() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    const attack = !!(p.buttons[0] && p.buttons[0].pressed);
    if (Math.abs(ax) > 0.18 || Math.abs(ay) > 0.18 || attack) markInput();
    return { x: clamp(ax, -1, 1), y: clamp(ay, -1, 1), attack };
  }
  return null;
}

// ============================== MOVEMENT / COLLISION ==============================
function passableAt(wx, wz) {
  const cx = Math.round(wx / TILE + DW / 2);
  const cy = Math.round(wz / TILE + DH / 2);
  if (!isFloor(cx, cy)) {
    if (doorMesh && doorMesh.open && doorCell && cx === doorCell.x && cy === doorCell.y) return true;
    return false;
  }
  return true;
}

function moveEntity(ent, dx, dz) {
  const p = ent.group.position;
  const r = ent.radius || 0.34;
  const blocked = (x, z) => !passableAt(x, z) ||
    propBlocks.some(b => Math.abs(x - b.x) < b.r && Math.abs(z - b.z) < b.r);
  const nx = p.x + dx, nz = p.z + dz;
  if (!blocked(nx, p.z)) p.x = nx;
  if (!blocked(p.x, nz)) p.z = nz;
}

const elGold = document.getElementById('gold'), elDepth = document.getElementById('depth');
const elMonsters = document.getElementById('monsters'), elHearts = document.getElementById('hearts');
const elPotions = document.getElementById('potionCount');
function updateHud() {
  elHp.textContent = hero.hp;
  elMax.textContent = hero.maxHp;
  elGold.textContent = hero.gold;
  elDepth.textContent = 'L' + hero.depth;
  elMonsters.textContent = hero.slain;
  elPotions.textContent = hero.potions;
  let hearts = '';
  for (let i = 0; i < hero.maxHp; i++) {
    hearts += i < hero.hp ? '&#9829;' : '<span style="color:#3a2020">&#9829;</span>';
  }
  elHearts.innerHTML = hearts;
}
function drinkPotion() {
  if (hero.potions > 0 && hero.hp < hero.maxHp) {
    hero.potions--;
    hero.hp = Math.min(hero.maxHp, hero.hp + 2);
    updateHud();
    sfx('potion');
  }
}

// ============================== LEVEL START / DESCEND ==============================
const fade = document.createElement('div');
fade.style.cssText = 'position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:50;';
document.body.appendChild(fade);

function startLevel(depth) {
  // drop everything from the previous level
  for (const m of monsters) levelGroup.remove(m.group);
  monsters.length = 0;
  clearLevel();
  generateDungeon(depth);
  buildFloorWalls(depth);
  buildProps(depth);
  buildTorchesAndStairs(depth);
  populateMonsters(depth);
  hero.hasKey = false;
  hero.stuckT = 0;
  aiDecisionT = 0;
  const s = cellToWorld(startCell.x, startCell.y);
  hero.group.position.set(s.x, 0, s.z);
  updateHud();
}

let descending = 0, descendedFlag = false;
function descend() {
  descending = 1.5;
  hero.depth++;
  sfx('stairs');
  updateHud();
}

// ============================== HERO AI ==============================
let aiDecisionT = 0;
let aiTarget = null;
let aiMode = 'fight';

function nearestMonster(maxDist) {
  let best = null, bd = maxDist * maxDist;
  for (const m of monsters) {
    if (!m.alive) continue;
    const d = m.group.position.distanceToSquared(hero.group.position);
    if (d < bd) { bd = d; best = m; }
  }
  return best;
}
function nearestLoot() {
  let best = null, bd = Infinity;
  // nearest chest first
  for (const c of chestList) {
    if (c.opened) continue;
    const d = Math.hypot(c.group.position.x - hero.group.position.x, c.group.position.z - hero.group.position.z);
    if (d < bd) { bd = d; best = { type: 'chest', chest: c, x: c.group.position.x, z: c.group.position.z }; }
  }
  for (const p of pickups) {
    if (p.taken || p.type === 'chest') continue;
    if (p.type === 'key' && hero.hasKey) continue;
    const d = Math.hypot(p.x - hero.group.position.x, p.z - hero.group.position.z);
    // the key matters most — grab it first when visible
    const weight = p.type === 'key' ? d * 0.1 : d;
    const curBest = best ? (best.type === 'chest' ? Math.hypot(best.x - hero.group.position.x, best.z - hero.group.position.z) : 1) : Infinity;
    if (weight < bd) { bd = weight; best = p; }
  }
  return best;
}

function randomReachableCellNear(wx, wz, maxCellDist) {
  const cx = clamp(Math.round(wx / TILE + DW / 2), 0, DW - 1);
  const cy = clamp(Math.round(wz / TILE + DH / 2), 0, DH - 1);
  const arr = [];
  for (let dy = -maxCellDist; dy <= maxCellDist; dy++) for (let dx = -maxCellDist; dx <= maxCellDist; dx++) {
    const nx = cx + dx, ny = cy + dy;
    if (!isFloor(nx, ny)) continue;
    const w = cellToWorld(nx, ny);
    arr.push(w);
  }
  return arr.length ? pick(arr) : null;
}

function heroMoveToward(x, z, dt, speed) {
  const p = hero.group.position;
  const dx = x - p.x, dz = z - p.z;
  const d = Math.hypot(dx, dz);
  if (d < 0.01) return 0;
  const step = Math.min(d, speed * dt);
  const bx = p.x, bz = p.z;
  moveEntity(hero, dx / d * step, dz / d * step);
  const moved = Math.hypot(p.x - bx, p.z - bz);
  if (moved < step * 0.25) {
    hero.stuckT += dt;
    if (hero.stuckT > 0.7) {
      hero.detour = randomReachableCellNear(p.x, p.z, 5);
      hero.stuckT = 0;
    }
  } else hero.stuckT = 0;
  if (hero.detour) {
    const dd = Math.hypot(hero.detour.x - p.x, hero.detour.z - p.z);
    if (dd < 0.6) hero.detour = null;
    else {
      moveEntity(hero, (hero.detour.x - p.x) / dd * speed * dt, (hero.detour.z - p.z) / dd * speed * dt);
    }
  }
  hero.group.rotation.y = Math.atan2(dx, dz);
  return Math.hypot(x - p.x, z - p.z);
}

function faceToward(x, z) {
  const p = hero.group.position;
  hero.group.rotation.y = Math.atan2(x - p.x, z - p.z);
}

function heroAttack() {
  if (hero.cooldown > 0 || hero.swing >= 0) return;
  hero.swing = 0;
  hero.swingHit = false;
  hero.cooldown = 0.75;
  sfx('swing');
}

function heroDecide(dt) {
  aiDecisionT -= dt;
  if (aiDecisionT > 0) return;
  aiDecisionT = 0.4;
  if (hero.hp <= 2 && hero.potions > 0) drinkPotion();
  const foe = nearestMonster(11);
  if (foe) { aiMode = 'fight'; aiTarget = foe; return; }
  const loot = nearestLoot();
  if (loot) { aiMode = 'loot'; aiTarget = loot; return; }
  if (!hero.hasKey) {
    // key must be somewhere — wander toward it / explore
    aiMode = 'explore';
    const keyPk = pickups.find(p => p.type === 'key' && !p.taken);
    if (keyPk) { aiMode = 'loot'; aiTarget = keyPk; }
    return;
  }
  if (doorMesh && !doorMesh.open) { aiMode = 'todoor'; aiTarget = doorMesh; return; }
  aiMode = 'tostairs';
  aiTarget = null;
}

function heroUpdate(dt, t) {
  hero.cooldown -= dt;
  // sword swing animation + impact frame
  if (hero.swing >= 0) {
    hero.swing += dt * 3.5;
    const ph = hero.swing;
    hero.armR.rotation.x = -0.9 - Math.sin(Math.min(ph, 1) * Math.PI) * 1.6;
    if (ph > 0.25 && !hero.swingHit) {
      hero.swingHit = true;
      for (const m of monsters) {
        if (!m.alive) continue;
        const reach = 1.45 + (m.kind === 'boss' ? 0.55 : 0);
        const d = m.group.position.distanceTo(hero.group.position);
        if (d > reach) continue;
        const ang = Math.atan2(m.group.position.x - hero.group.position.x, m.group.position.z - hero.group.position.z);
        const diff = Math.abs((((ang - hero.group.rotation.y) % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI);
        if (diff < 1.2) {
          damageMonster(m, 1);
          const kb = m.group.position.clone().sub(hero.group.position).normalize().multiplyScalar(0.45);
          m.knockback = kb;
        }
      }
    }
    if (ph >= 1.6) { hero.swing = -1; }
  }

  const controlled = performance.now() - lastInputTime < 6000;
  if (controlled) {
    let ix = 0, iz = 0;
    if (keys['KeyW'] || keys['ArrowUp']) iz -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) iz += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
    const gp = gamepadState();
    if (gp) { ix += gp.x; iz += gp.y; if (gp.attack) heroAttack(); }
    const mag = Math.hypot(ix, iz);
    if (mag > 0.05) {
      const s = 3.0 * dt;
      moveEntity(hero, ix / mag * s, iz / mag * s);
      hero.group.rotation.y = Math.atan2(ix, iz);
    }
    if (keys['Space']) heroAttack();
  } else {
    heroDecide(dt);
    let tx = null, tz = null, moving = false;
    if (aiMode === 'fight' && aiTarget && aiTarget.alive !== false) {
      const m = aiTarget;
      if (!m.alive) { aiTarget = null; aiDecisionT = 0; }
      else {
        tx = m.group.position.x; tz = m.group.position.z;
        const d = Math.hypot(tx - hero.group.position.x, tz - hero.group.position.z);
        if (d < (m.kind === 'boss' ? 2.0 : 1.4)) {
          faceToward(tx, tz);
          heroAttack();
          tx = null;
        }
      }
    } else if (aiMode === 'loot' && aiTarget) {
      const gone = aiTarget.taken || (aiTarget.chest && aiTarget.chest.opened) ||
                   (aiTarget.group && !aiTarget.group.parent);
      if (gone) { aiTarget = null; aiDecisionT = 0; }
      else { tx = aiTarget.x; tz = aiTarget.z; }
    } else if (aiMode === 'explore') {
      if (!hero.wanderT || hero.wanderT <= 0) {
        hero.wanderT = rnd(2, 4);
        hero.wander = randomReachableCellNear(hero.group.position.x, hero.group.position.z, 8);
      }
      hero.wanderT -= dt;
      if (hero.wander) { tx = hero.wander.x; tz = hero.wander.z; }
    } else if (aiMode === 'todoor' && aiTarget) {
      if (doorMesh && doorMesh.open) { aiTarget = null; aiDecisionT = 0; }
      else { tx = aiTarget.x; tz = aiTarget.z; }
    } else if (aiMode === 'tostairs') {
      tx = stairsPos.x; tz = stairsPos.z;
    } else {
      aiTarget = null; aiDecisionT = 0;
    }
    if (tx !== null) {
      const d = heroMoveToward(tx, tz, dt, 2.4);
      if (d < 0.5) aiDecisionT = 0;
    }
  }

  // walk cycle + torch sway
  const walked = hero.group.position.distanceTo(hero._lastPos ? hero._lastPos : new THREE.Vector3(1e9, 0, 0));
  if (!hero._lastPos) hero._lastPos = hero.group.position.clone();
  else hero._lastPos.set(hero.group.position.x, 0, hero.group.position.z);
  hero.walking = walked / Math.max(dt, 0.001) > 0.4;
  if (hero.walking) hero.walkPhase += dt * 9;
  const sw = Math.sin(hero.walkPhase) * (hero.walking ? 0.55 : 0.05);
  hero.legL.rotation.x = sw; hero.legR.rotation.x = -sw;
  if (hero.swing < 0) hero.armR.rotation.x = -sw * 0.5;
  hero.armL.rotation.x = sw * 0.5;
  hero.armL.rotation.z = Math.sin(hero.walkPhase * 0.5) * 0.07;

  // descend check
  const dstairs = Math.hypot(hero.group.position.x - stairsPos.x, hero.group.position.z - stairsPos.z);
  if (descending === 0 && (!doorMesh || doorMesh.open) && dstairs < 0.9) descend();
}

// ============================== COMBAT ==============================
function damageMonster(m, dmg) {
  m.hp -= dmg;
  m.flash = 0.14;
  sfx('hit');
  if (m.hp <= 0 && m.alive) {
    m.alive = false;
    m.dead = true;
    m.deathT = 0;
    hero.slain++;
    hero.gold += m.kind === 'boss' ? 10 : rndi(1, 3);
    if (Math.random() < 0.3) hero.hp = Math.min(hero.maxHp, hero.hp + 1);
    burst(m.kind === 'slime' ? 'slime' : 'bone', m.group.position.x, m.group.position.z);
    sfx('die');
    if (Math.random() < 0.2) spawnPickup('potion', m.group.position.x + rnd(-0.3, 0.3), m.group.position.z + rnd(-0.3, 0.3));
    if (Math.random() < 0.5) spawnPickup('gold', m.group.position.x + rnd(-0.3, 0.3), m.group.position.z + rnd(-0.3, 0.3));
    updateHud();
  }
}
function damageHero(dmg, fromX, fromZ) {
  if (hero.hurtTimer > 0) return;
  hero.hp -= dmg;
  hero.hurtTimer = 0.55;
  hero.flash = 0.2;
  sfx('hurt');
  const kb = new THREE.Vector3(hero.group.position.x - fromX, 0, hero.group.position.z - fromZ).normalize().multiplyScalar(0.5);
  moveEntity(hero, kb.x, kb.z);
  if (hero.hp <= 0) {
    hero.hp = Math.ceil(hero.maxHp / 2);   // the show never stops
    hero.potions = Math.max(hero.potions, 1);
  }
  updateHud();
}

// ============================== MONSTER AI ==============================
function monsterUpdate(m, dt, t) {
  if (m.dead) {
    m.deathT += dt;
    const s = Math.max(0.001, 1 - m.deathT * 2.4) * (m.boss ? 1.8 : 1);
    m.group.scale.setScalar(s);
    if (m.deathT > 0.45) levelGroup.remove(m.group);
    return;
  }
  // hit flash: quick scale pulse + reddened emissive is over-render; use pulse
  if (m.flash > 0) {
    m.flash -= dt;
    const pulse = 1 + Math.max(0, m.flash) * 1.2;
    m.group.scale.setScalar((m.boss ? 1.8 : 1) * pulse);
  } else if (m.group.scale.x !== (m.boss ? 1.8 : 1)) {
    m.group.scale.setScalar(m.boss ? 1.8 : 1);
  }

  const p = hero.group.position, mp = m.group.position;
  const d = Math.hypot(p.x - mp.x, p.z - mp.z);
  m.cooldown -= dt;

  if (m.knockback) {
    moveEntity(m, m.knockback.x, m.knockback.z);
    m.knockback.multiplyScalar(1 - dt * 8);
    if (m.knockback.length() < 0.05) m.knockback = null;
  }

  if (d < 11) {
    m.group.rotation.y = Math.atan2(p.x - mp.x, p.z - mp.z);
    if (d > m.range * 0.9) {
      const wob = Math.sin(t * 2.2 + m.wobPhase) * 0.3;
      const dirx = (p.x - mp.x) / d, dirz = (p.z - mp.z) / d;
      moveEntity(m, (dirx + dirz * wob) * m.spd * dt, (dirz - dirx * wob) * m.spd * dt);
      const s2 = Math.sin(t * 9 + m.wobPhase) * 0.55;
      if (m.parts.legs.length) { m.parts.legs[0].rotation.x = s2; m.parts.legs[1].rotation.x = -s2; }
      if (m.kind === 'slime') m.parts.torso.position.y = 0.24 + Math.abs(Math.sin(t * 4 + m.wobPhase)) * 0.12;
    } else if (m.cooldown <= 0) {
      m.cooldown = m.boss ? 1.5 : 1.4;
      if (m.parts.armR) m.parts.armR.rotation.x = -1.4;
      if (d < m.range * 1.3) damageHero(m.dmg, mp.x, mp.z);
    }
  } else {
    // wander
    if (!m.wanderTarget || Math.hypot(m.wanderTarget.x - mp.x, m.wanderTarget.z - mp.z) < 0.6) {
      const c = randomReachableCellNear(mp.x, mp.z, 3);
      if (c) m.wanderTarget = c;
    }
    if (m.wanderTarget) {
      const dx = m.wanderTarget.x - mp.x, dz = m.wanderTarget.z - mp.z;
      const dd = Math.hypot(dx, dz);
      if (dd > 0.05) {
        moveEntity(m, dx / dd * m.spd * 0.45 * dt, dz / dd * m.spd * 0.45 * dt);
        m.group.rotation.y = Math.atan2(dx, dz);
      }
    }
    if (m.kind === 'slime') m.parts.torso.position.y = 0.24 + Math.abs(Math.sin(t * 3 + m.wobPhase)) * 0.08;
  }
  if (m.parts.armR) m.parts.armR.rotation.x = Math.min(0, m.parts.armR.rotation.x + dt * 4);
}

// ============================== PICKUPS & DOOR ==============================
function updatePickups(dt, t) {
  const p = hero.group.position;
  for (const pk of pickups) {
    if (pk.taken) continue;
    if (pk.group) {
      pk.group.position.y = 0.04 + Math.sin(t * 2.2 + pk.group.userData.bob) * 0.05;
      if (pk.group.userData.spin) pk.group.rotation.y = t * 1.6;
    }
    const d = Math.hypot(pk.x - p.x, pk.z - p.z);
    if (d < 0.85) {
      if (pk.type === 'chest') {
        const c = pk.chest;
        if (c && !c.opened) {
          c.opened = true;
          c.lid.rotation.x = -1.25;
          c.lid.position.z = -0.22;
          sfx('pickup');
          for (let i = 0; i < rndi(2, 3); i++) spawnPickup('gold', c.group.position.x + rnd(-0.5, 0.5), c.group.position.z + rnd(-0.5, 0.5));
          if (Math.random() < 0.5) spawnPickup('potion', c.group.position.x + rnd(-0.4, 0.4), c.group.position.z + rnd(-0.4, 0.4));
        }
        if (c) pk.taken = true;
      } else {
        pk.taken = true;
        if (pk.group) levelGroup.remove(pk.group);
        sfx('pickup');
        if (pk.type === 'gold') hero.gold += rndi(2, 6);
        else if (pk.type === 'potion') hero.potions++;
        else if (pk.type === 'key') hero.hasKey = true;
        updateHud();
      }
    }
  }
  if (doorMesh && !doorMesh.open && hero.hasKey) {
    const d = Math.hypot(doorMesh.x - p.x, doorMesh.z - p.z);
    if (d < 1.7) {
      doorMesh.open = true;
      sfx('door');
      doorMesh.hasp.visible = false;
      doorMesh.lockGlow.visible = false;
      doorMesh.panel.rotation.y = -1.35;
      doorMesh.panel.position.x = -0.55;
      const idx = propBlocks.findIndex(b => Math.abs(b.x - doorMesh.x) < 0.01 && Math.abs(b.z - doorMesh.z) < 0.01);
      if (idx >= 0) propBlocks.splice(idx, 1);
    }
  }
}

// ============================== POST-PROCESSING ==============================
// half-res RT (nearest) + depth -> fullscreen pass: depth-aware tilt-shift,
// subtle 4x4 Bayer dither, vignette, film grain
const RT_SCALE = 0.5;
let rtW = Math.max(1, Math.floor(window.innerWidth * RT_SCALE));
let rtH = Math.max(1, Math.floor(window.innerHeight * RT_SCALE));
const sceneRT = new THREE.WebGLRenderTarget(rtW, rtH, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, generateMipmaps: false,
});
sceneRT.depthTexture = new THREE.DepthTexture(rtW, rtH);
sceneRT.depthTexture.type = THREE.UnsignedIntType;

const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postScene = new THREE.Scene();
const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: sceneRT.texture },
    tDepth: { value: sceneRT.depthTexture },
    uRes: { value: new THREE.Vector2(rtW, rtH) },
    uTime: { value: 0 },
    uPlayerViewZ: { value: -20 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tScene;
    uniform sampler2D tDepth;
    uniform vec2 uRes;
    uniform float uTime;
    uniform float uPlayerViewZ;

    float viewZFromDepth(float d) {
      float near = 0.1; float far = 200.0;
      return (near * far) / ((far - near) * d - far);
    }
    float Bayer2(vec2 a) { a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
    #define Bayer4(a) (Bayer2(0.5*(a))*0.25 + Bayer2(a))
    float hash21(vec2 p) {
      p = fract(p * vec2(234.34, 435.345));
      p += dot(p, p + 34.23);
      return fract(p.x * p.y);
    }

    void main() {
      vec2 px = 1.0 / uRes;
      vec2 suv = (floor(vUv * uRes) + 0.5) / uRes;
      float depth = texture2D(tDepth, suv).x;
      float vz = viewZFromDepth(depth);

      // tilt-shift: razor-sharp band through the player, blur growing to the
      // top and bottom, weighted by how far a surface is from the hero's plane
      float yDist = abs(vUv.y - 0.5) * 2.0;
      float depthDist = clamp(abs(vz - uPlayerViewZ) * 0.3, 0.0, 2.5);
      float blurW = smoothstep(0.15, 0.85, yDist * (0.5 + depthDist * 0.5)) * 2.4;
      blurW = max(blurW, smoothstep(1.2, 2.5, depthDist) * 1.4);

      vec3 col;
      if (blurW < 0.04) {
        col = texture2D(tScene, suv).rgb;
      } else {
        col = texture2D(tScene, suv).rgb * 0.24;
        for (int i = 1; i <= 6; i++) {
          float wgt = 0.36 / float(i);
          col += texture2D(tScene, clamp(suv + vec2(0.0,  float(i) * blurW * px.y), 0.0, 1.0)).rgb * wgt;
          col += texture2D(tScene, clamp(suv + vec2(0.0, -float(i) * blurW * px.y), 0.0, 1.0)).rgb * wgt;
        }
        col /= 1.9;
      }

      col = pow(max(col, 0.0), vec3(0.9));

      // subtle ordered dither across tonal levels (never a screen-door pattern)
      float b = Bayer4(vUv * uRes);
      col += (b - 0.5) * (2.4 / 255.0);
      col = floor(col * 255.0) / 255.0;

      // vignette
      vec2 q = vUv - 0.5;
      col *= 1.0 - dot(q, q) * 0.85;

      // film grain
      col += (hash21(vUv * uRes + fract(uTime) * 137.0) - 0.5) * 0.035;

      gl_FragColor = vec4(col, 1.0);
    }
  `,
  depthTest: false, depthWrite: false,
});
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat);
postQuad.frustumCulled = false;
postScene.add(postQuad);

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  rtW = Math.max(1, Math.floor(w * RT_SCALE));
  rtH = Math.max(1, Math.floor(h * RT_SCALE));
  sceneRT.setSize(rtW, rtH);
  postMat.uniforms.uRes.value.set(rtW, rtH);
});

// ============================== DEBUG HANDLE ==============================
window.__tl = {
  ready: true,
  monsters: () => monsters.filter(m => m.alive).length,
  slain: () => hero.slain,
  gold: () => hero.gold,
  hp: () => hero.hp,
  potions: () => hero.potions,
  depth: () => hero.depth,
  hasKey: () => hero.hasKey,
  player: { get x() { return hero.group.position.x; }, get z() { return hero.group.position.z; } },
};

// ============================== MAIN LOOP ==============================
startLevel(1);
updateHud();

const clock = new THREE.Clock();
let elapsed = 0;
const _camTarget = new THREE.Vector3();
const _vz = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.08);
  elapsed += dt;
  const t = elapsed;

  if (descending > 0) {
    descending -= dt;
    fade.style.opacity = descending > 0.7 ? '1' : '0';
    if (descending <= 0.7 && !descendedFlag) {
      descendedFlag = true;
      startLevel(hero.depth);
    }
    if (descending <= 0) { descendedFlag = false; fade.style.opacity = '0'; }
  } else {
    heroUpdate(dt, t);
    for (let i = monsters.length - 1; i >= 0; i--) {
      const m = monsters[i];
      monsterUpdate(m, dt, t);
      if (m.dead && m.deathT > 0.5) monsters.splice(i, 1);
    }
    updatePickups(dt, t);
    // trickle respawn — monsters are always present and active
    trickleT -= dt;
    if (trickleT <= 0) {
      trickleT = 6;
      if (monsters.filter(m => m.alive).length < 3) {
        const c = randomFloorCell(5);
        if (c) spawnMonster(pick(MON_KINDS), c.x, c.y);
      }
    }
  }

  // debris physics
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.t += dt;
    d.vy -= 9 * dt;
    d.mesh.position.x += d.vx * dt;
    d.mesh.position.y += d.vy * dt;
    d.mesh.position.z += d.vz * dt;
    d.mesh.rotation.x += d.vr * dt;
    d.mesh.rotation.z += d.vr * 0.7 * dt;
    if (d.mesh.position.y < 0.06) { d.mesh.position.y = 0.06; d.vy = 0; d.vx *= 0.85; d.vz *= 0.85; }
    if (d.t > d.life) { levelGroup.remove(d.mesh); debris.splice(i, 1); }
  }

  // embers
  for (let i = 0; i < EMBER_N; i++) {
    const e = emberData[i];
    e.life -= dt;
    if (e.life <= 0 && torchSpots.length) {
      let best = torchSpots[0], bd = 1e9;
      for (const s of torchSpots) {
        const d = s.distanceToSquared(hero.group.position) + rnd(0, 30);
        if (d < bd) { bd = d; best = s; }
      }
      e.pos.copy(best);
      e.v.set(rnd(-0.25, 0.25), rnd(0.9, 1.7), rnd(-0.25, 0.25));
      e.life = e.max;
    }
    if (e.life > 0) {
      e.pos.addScaledVector(e.v, dt);
      e.pos.x += Math.sin(t * 3 + i) * 0.4 * dt;
      e.v.y += 0.4 * dt;
    }
    emberPos[i * 3] = e.pos.x; emberPos[i * 3 + 1] = e.pos.y; emberPos[i * 3 + 2] = e.pos.z;
  }
  emberGeo.attributes.position.needsUpdate = true;

  // dust drifts around the hero
  for (let i = 0; i < DUST_N; i++) {
    if (dustPos[i * 3 + 1] < -9) {
      dustPos[i * 3] = hero.group.position.x + rnd(-4, 4);
      dustPos[i * 3 + 1] = rnd(0.2, 2.2);
      dustPos[i * 3 + 2] = hero.group.position.z + rnd(-4, 4);
    }
    const dd = dustData[i];
    dustPos[i * 3] += dd.v.x * dt;
    dustPos[i * 3 + 1] += dd.v.y * dt;
    dustPos[i * 3 + 2] += dd.v.z * dt;
    if (dustPos[i * 3 + 1] < 0.05 || dustPos[i * 3 + 1] > 2.6) dd.v.y *= -1;
    if (Math.hypot(dustPos[i * 3] - hero.group.position.x, dustPos[i * 3 + 2] - hero.group.position.z) > 7) {
      dustPos[i * 3] = hero.group.position.x + rnd(-4, 4);
      dustPos[i * 3 + 2] = hero.group.position.z + rnd(-4, 4);
    }
  }
  dustGeo.attributes.position.needsUpdate = true;

  // torch flicker + lights follow the hero
  const flick = 1.9 + Math.sin(t * 11) * 0.18 + Math.sin(t * 23.7) * 0.12 + Math.sin(t * 5.3) * 0.1;
  torchLight.intensity = flick;
  torchLight.position.set(hero.group.position.x, 1.25, hero.group.position.z + 0.25);
  torchSpot.position.set(hero.group.position.x + 1.5, 6.5, hero.group.position.z + 2.5);
  torchSpot.target.position.copy(hero.group.position);
  torchSpot.intensity = 1.45 + Math.sin(t * 9.1) * 0.12;
  if (hero.torchFlameMesh) hero.torchFlameMesh.scale.setScalar(0.85 + Math.sin(t * 13) * 0.15 + Math.cos(t * 29) * 0.06);
  hero.flash = Math.max(0, hero.flash - dt);
  hero.hurtTimer = Math.max(0, hero.hurtTimer - dt);
  elHearts.style.color = hero.flash > 0 ? '#ff6a50' : '#c23b2e';

  // sconce flicker
  for (const g of torchGroups) {
    if (g.userData.light) {
      g.userData.light.intensity = (g.userData.light.distance > 8 ? 1.05 : 0.75) + Math.sin(t * 10 + g.position.x) * 0.14;
      const fl = g.userData.flame;
      if (fl) fl.scale.y = 1 + Math.sin(t * 12 + g.position.z) * 0.2;
    }
  }

  // camera smooth follow
  _camTarget.set(
    hero.group.position.x + CAM_OFFSET.x,
    CAM_OFFSET.y,
    hero.group.position.z + CAM_OFFSET.z
  );
  camera.position.lerp(_camTarget, 1 - Math.exp(-4 * dt));
  camera.lookAt(hero.group.position.x, 0.9, hero.group.position.z);

  postMat.uniforms.uTime.value = t;
  _vz.copy(hero.group.position).applyMatrix4(camera.matrixWorldInverse);
  postMat.uniforms.uPlayerViewZ.value = _vz.z;

  renderer.setRenderTarget(sceneRT);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
}
animate();
</script>
</body>
</html>
